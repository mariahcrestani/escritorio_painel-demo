<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Horizonte — Painel de Projetos (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --cream:#f7f2ea; --card:#fffdf8; --ink:#1c1a17; --ink-soft:rgba(28,26,23,.76); --ink-faint:rgba(28,26,23,.64);
    --line:rgba(28,26,23,.1); --line-soft:rgba(28,26,23,.08);
    --tag:#efe6d8; --tag-ink:rgba(28,26,23,.82);
    --accent:#c2561f; --accent-ink:#fff;
    --green-bg:#dbe6d4; --green-ink:#3d5a34; --green-solid:#5f7e55;
    --amber-bg:#f3e3c2; --amber-ink:#6f4c10; --amber-solid:#d79a3c;
    --red-bg:#f1d9d3; --red-ink:#a5392b; --red-solid:#c1584a;
    --info-bg:#dbe3e8; --info-ink:#2f4a5a; --info-solid:#6f95a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);height:100%}
  body{font-family:'Work Sans',sans-serif;font-size:14px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(28,26,23,.16);border-radius:999px}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  h1,h2,h3,h4{font-family:'Lora',serif;margin:0;text-wrap:balance}
  .num{font-variant-numeric:tabular-nums}
  .pill{border-radius:999px}
  .icon{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}

  #app{display:flex;height:100vh;height:100dvh;overflow:hidden}

  /* ---- sidebar ---- */
  .sidebar{width:246px;flex:none;display:flex;flex-direction:column;padding:20px 14px;border-right:1px solid var(--line-soft);overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 6px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
  .brand-mark svg{stroke:var(--cream)}
  .brand-mark img{width:22px;height:22px;object-fit:contain}
  .brand-name{font-weight:600;font-size:15.5px;line-height:1.15}
  .brand-sub{font-size:12px;color:var(--ink-soft)}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;font-size:13.5px;border-radius:999px;border:none;background:none;color:var(--ink);text-align:left;width:100%}
  .nav-item:hover{background:rgba(28,26,23,.05)}
  .nav-item.active{background:var(--tag);font-weight:600}
  .nav-chev{margin-left:auto;display:inline-flex;transition:transform .15s}
  .nav-chev .icon{width:13px;height:13px}
  .nav-chev.open{transform:rotate(90deg)}
  .nav-group.group-active{font-weight:600}
  .nav-count{margin-left:auto;font-size:12px;min-width:18px;text-align:center;padding:1px 7px;border-radius:999px;background:rgba(28,26,23,.07);color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .nav-count.zero{background:none;color:var(--ink-faint)}
  .nav-sub{display:flex;flex-direction:column;gap:2px;margin:0 0 4px 21px;padding-left:10px;border-left:1px solid var(--line)}
  .nav-sub-item{display:flex;align-items:center;padding:7px 12px;cursor:pointer;font-size:12.5px;border-radius:999px;border:none;background:none;color:var(--ink-soft);text-align:left;width:100%}
  .nav-sub-item:hover{background:rgba(28,26,23,.05);color:var(--ink)}
  .nav-sub-item.active{background:var(--tag);color:var(--ink);font-weight:600}
  .nav-badge{margin-left:auto;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
  .btn-novo{margin-top:16px;font-size:13px;padding:10px 14px;border-radius:999px;border:none;background:var(--ink);color:var(--cream);cursor:pointer;font-weight:500}
  .btn-novo:hover{opacity:.9}
  .btn-secondary{font-size:12px;padding:8px 6px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-weight:500}
  .btn-secondary:hover{background:var(--tag)}
  .whoami{margin-top:auto;padding-top:16px}
  .whoami label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;color:var(--ink-faint)}
  .whoami select{width:100%;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}

  /* ---- busca rápida global ---- */
  .search-box{position:relative;margin-bottom:14px}
  .search-input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .search-input:focus{outline:none;border-color:var(--ink)}
  .search-dropdown{position:absolute;top:calc(100% + 6px);left:0;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -14px rgba(28,26,23,.4);padding:6px;z-index:40;max-height:400px;overflow-y:auto}
  .search-result{padding:9px 11px;border-radius:9px;cursor:pointer}
  .search-result:hover{background:var(--tag)}
  .search-result-title{font-size:12.5px;font-weight:600}
  .search-result-meta{font-size:12px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search-more, .search-empty{padding:10px 11px;font-size:12px;color:var(--ink-faint);text-align:center}
  .search-result-empresa{background:var(--tag);margin-bottom:4px}

  /* ---- seletor de empresa (autocomplete + cadastro rápido) ---- */
  .empresa-picker{position:relative}
  .empresa-warning{font-size:12px;color:var(--amber-ink);background:var(--amber-bg);border-radius:9px;padding:9px 11px;margin:2px}
  .empresa-warning button{margin-top:8px}

  /* ---- main ---- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{padding:22px 28px 14px;display:flex;align-items:center;gap:16px;flex:none}
  .topbar h2{font-size:24px;font-weight:600}
  .segmented{display:inline-flex;padding:3px;border-radius:999px;background:var(--tag);gap:2px}
  .segmented button{padding:6px 13px;border-radius:999px;font-size:12px;border:none;background:none;cursor:pointer;color:var(--ink-soft)}
  .segmented button.active{background:var(--ink);color:var(--cream)}
  .seg{margin-left:auto}
  .content{flex:1;overflow:auto;padding:4px 28px 24px}

  .card{padding:13px;cursor:pointer;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(28,26,23,.05),0 6px 16px rgba(28,26,23,.06);transition:transform .12s ease, box-shadow .12s ease}
  .card:hover{transform:translateY(-1px);box-shadow:0 2px 4px rgba(28,26,23,.06),0 10px 22px rgba(28,26,23,.09)}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}
  .fee-box{display:flex;flex-direction:column;gap:5px;padding:9px 10px;margin-bottom:7px;border-radius:12px;background:var(--tag)}
  .fee-row{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
  .fee-date{margin-left:auto;color:var(--ink-faint)}

  /* ---- list views ---- */
  .list-card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(28,26,23,.05),0 6px 16px rgba(28,26,23,.06);overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:12px 14px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);text-align:left;font-weight:600}
  td{padding:11px 14px}
  tr.row{cursor:pointer;border-top:1px solid var(--line-soft)}
  tr.row:hover{background:rgba(28,26,23,.03)}
  .empty-state{border:1.5px dashed var(--line);border-radius:14px;padding:32px;text-align:center;font-size:12.5px;color:var(--ink-faint);margin-top:8px}
  .checklist-inline{display:flex;flex-direction:column;gap:5px}
  .checklist-inline .fee-row{font-size:12px}

  /* ---- barra de filtros ---- */
  .filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;padding-top:4px}
  .filter-bar select, .filter-bar input[type=number]{font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .filter-bar input[type=number]{width:118px}
  .filter-chip{font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .filter-chip:hover{background:var(--tag)}
  .filter-chip.active{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .filter-clear{font-size:12px;padding:7px 12px;border-radius:999px;border:none;background:none;color:var(--ink-faint);cursor:pointer;text-decoration:underline}
  .filter-count{margin-left:auto;font-size:12px;color:var(--ink-faint);white-space:nowrap}

  /* ---- modal ---- */
  .overlay{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(28,26,23,.38);z-index:30}
  .modal{width:min(620px,94vw);max-height:88vh;overflow:auto;background:var(--card);border-radius:22px;box-shadow:0 24px 60px rgba(28,26,23,.28);padding:26px}
  .modal-small{width:min(420px,94vw)}
  .modal-head{display:flex;align-items:flex-start;gap:10px}
  .modal-title{font-family:'Lora',serif;font-weight:600;font-size:20px}
  .modal-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .title-input{font-family:'Lora',serif;font-weight:600;font-size:20px;border:none;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);width:100%;padding:2px 0 4px;margin-bottom:10px}
  .title-input:focus{outline:none;border-bottom-color:var(--ink)}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .edit-grid input, .edit-grid select{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px}
  .edit-grid label:last-child{grid-column:1 / -1}
  .icon-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--tag);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
  .icon-btn:hover{background:rgba(28,26,23,.14)}
  .icon-btn:disabled{opacity:.3;cursor:default}
  .icon-btn:disabled:hover{background:var(--tag)}
  .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:14px 0;margin-top:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .field-label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:4px}
  .field-val{font-size:12.5px}
  select.inline, input.inline{font-size:12px;font-family:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 7px;background:#fff;color:var(--ink)}
  .tabs{margin-top:14px}
  .tabs button{padding:7px 13px}
  .badge-mod{display:inline-flex;align-items:center;gap:3px;margin-left:8px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--amber-bg);color:var(--amber-ink);vertical-align:middle}
  .badge-mod .icon{width:10px;height:10px}
  .tipo-chips{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:0 0 8px}
  .tipo-chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid transparent;background:rgba(28,26,23,.06);color:var(--ink-faint);cursor:pointer;font-family:inherit}
  .tipo-chip:hover{background:rgba(28,26,23,.11);color:var(--ink-soft)}
  .tipo-chip.active{background:var(--c-bg);color:var(--c-ink);border-color:var(--c-ink);font-weight:600}
  .tipo-chips .rotulo{font-size:12px;color:var(--ink-faint);margin-right:0}
  .tipo-chips .sub-chip{font-size:12px;padding:5px 8px}
  .tipo-chips .sep{width:1px;height:18px;background:var(--line);margin:0 2px}
  .comment-opts{display:flex;align-items:center;gap:8px;margin:-2px 0 10px;flex-wrap:wrap}
  .comment-opts select{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px}
  .hist-toggle{display:flex;align-items:center;gap:6px;width:100%;background:none;border:none;padding:0;cursor:pointer;font-size:12px;font-weight:600;font-family:'Lora',serif;color:var(--ink);text-align:left}
  .hist-toggle .chev{margin-left:auto;font-family:system-ui,sans-serif;font-size:12px;color:var(--ink-faint);transition:transform .15s}
  .hist-toggle.open .chev{transform:rotate(90deg)}
  .hist-sub{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin:12px 0 7px}
  .copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;flex:none;font-family:inherit}
  .copy-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .copy-btn .icon{width:12px;height:12px}
  .copy-btn.copied{background:var(--green-bg);color:var(--green-ink);border-color:var(--green-solid)}
  .protocolo{font-size:16px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums}
  .protocolo-vazio{font-size:12.5px;font-weight:500;color:var(--ink-faint)}
  .fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 6px 4px 11px;border-radius:999px;background:var(--tag);color:var(--ink)}
  .fchip button{border:none;background:rgba(28,26,23,.12);width:17px;height:17px;border-radius:50%;font-size:12px;cursor:pointer;color:var(--ink);line-height:17px;padding:0}
  .fchip button:hover{background:var(--ink);color:var(--cream)}
  .fhint{font-size:12px;color:var(--ink-faint)}
  .fbtn{font-size:12px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-weight:500;font-family:inherit}
  .fbtn.open{background:var(--tag)}
  .fmenu-host{position:relative}
  .fmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:50;min-width:230px;max-height:340px;overflow:auto;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 40px rgba(28,26,23,.18);display:flex;flex-direction:column}
  .fmenu button{text-align:left;padding:8px 12px;border:none;background:none;border-radius:9px;font-size:12.5px;cursor:pointer;color:var(--ink);font-family:inherit}
  .fmenu button:hover{background:var(--tag)}
  .fmenu .fback{color:var(--ink-faint);font-size:12px}
  .fnum{padding:8px 12px;font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fnum input{width:80px}
  .radar{margin:12px 0 0;padding:10px 13px;border-radius:12px;background:var(--info-bg);color:var(--info-ink);font-size:12px}
  .radar-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .radar-head b{font-family:'Lora',serif;font-size:12px}
  .radar-item{display:flex;align-items:flex-start;gap:8px;margin-top:7px;padding-top:7px;border-top:1px solid rgba(61,90,107,.18)}
  .radar-item .rtxt{flex:1;min-width:0;color:var(--ink)}
  .radar-item .rtxt small{display:block;color:var(--ink-soft);font-size:12px;margin-top:1px}
  .radar-btn{font-size:12px;padding:4px 11px;border-radius:999px;border:1px solid var(--info-solid);background:#fff;color:var(--info-ink);cursor:pointer;font-family:inherit;white-space:nowrap}
  .radar-btn:hover{background:var(--info-ink);color:#fff}
  .radar-form{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .radar-form select, .radar-form input{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
  .radar-form input{flex:1;min-width:160px}
  /* mural em formato de post-its: grade de cartões pequenos, levemente inclinados */
  .postits{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 12px;padding:6px 2px}
  .postit{position:relative;display:flex;flex-direction:column;gap:5px;min-height:118px;padding:15px 12px 10px;border-radius:3px 3px 16px 3px;background:var(--pi-bg,#f3e3c2);color:var(--ink);box-shadow:0 5px 12px rgba(28,26,23,.13);cursor:pointer;transform:rotate(var(--rot,0deg));transition:transform .12s,box-shadow .12s}
  .postit:nth-child(odd){--rot:-.8deg}
  .postit:nth-child(even){--rot:.7deg}
  .postit:nth-child(3n){--rot:.25deg}
  .postit:hover{transform:rotate(0) translateY(-2px);box-shadow:0 10px 20px rgba(28,26,23,.2);z-index:2}
  .postit::before{content:"";position:absolute;top:5px;left:50%;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:rgba(28,26,23,.22)}
  .pi-head{display:flex;justify-content:space-between;gap:6px;align-items:baseline;font-size:12px}
  .pi-head b{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .pi-head span{color:var(--ink-soft);flex:none;font-size:12px}
  .pi-sub{font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pi-text{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;flex:1}
  .pi-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
  .pi-btn{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid rgba(28,26,23,.25);background:rgba(255,255,255,.55);color:var(--ink);cursor:pointer;font-family:inherit}
  .pi-btn:hover{background:var(--ink);color:var(--cream)}
  .postit .badge-mod{margin-left:0;font-size:12px;padding:1px 6px}
  /* notas rápidas (pessoais) + diário */
  .notas{margin-bottom:18px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
  .nota-add{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
  .nota-add input{font-size:12.5px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--cream);font-family:inherit;color:var(--ink)}
  .nota-add input.n-texto{flex:3;min-width:220px}
  .nota-add input.n-proj{flex:2;min-width:180px}
  .nota-add button{font-size:12.5px;padding:8px 16px;border-radius:999px;border:none;background:var(--ink);color:var(--cream);cursor:pointer;font-family:inherit}
  .nota-row{display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid var(--line-soft);font-size:12.5px}
  .nota-row:first-of-type{border-top:none}
  .nota-row .n-chk{border:none;background:none;cursor:pointer;display:inline-flex;padding:0;color:var(--ink)}
  .nota-row .n-txt{flex:1;min-width:0}
  .nota-row .n-txt.feita{color:var(--ink-faint);text-decoration:line-through}
  .nota-row .n-meta{font-size:12px;color:var(--ink-faint);white-space:nowrap}
  .n-proj-chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--tag);color:var(--ink);border:none;cursor:pointer;font-family:inherit;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
  .n-proj-chip:hover{background:var(--ink);color:var(--cream)}
  .n-x{border:none;background:none;cursor:pointer;color:var(--ink-faint);font-size:13px;padding:0 4px}
  .n-x:hover{color:var(--red-ink)}
  .diario-dia{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint);margin:12px 0 4px}
  .rev-wrap{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 4px 0 9px;color:var(--ink-soft)}
  .rev-wrap input{border:none!important;width:52px;padding:5px 4px!important;background:transparent!important;font-weight:400;color:var(--ink)}
  .edit-btn{border:none;background:none;cursor:pointer;color:var(--ink-faint);font-size:12px;padding:0 3px}
  .edit-btn:hover{color:var(--ink)}
  .edit-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px}
  .edit-row input[type=text]{flex:1;min-width:180px;font-size:12.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-family:inherit;color:var(--ink)}
  .edit-row button.ok, .edit-row button.cancel{font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer;font-family:inherit}
  .edit-row button.ok{border:none;background:var(--ink);color:var(--cream)}
  .edit-row button.cancel{border:1px solid var(--line);background:#fff;color:var(--ink)}
  .editado{font-size:12px;color:var(--ink-faint);margin-left:6px}
  .cell-flag{display:inline-flex;flex:none}
  .cell-flag .icon{width:12px;height:12px}

<div class="demo-faixa">Versão de demonstração · dados fictícios</div>
<div id="app"></div>

<script>
/* ===================== MODO DEMONSTRAÇÃO ===================== */
// Versão de portfólio: sem login e sem servidor. Todos os dados abaixo são
// fictícios e vivem só na memória do navegador (recarregar a página restaura
// o cenário inicial). O "sb" é um substituto mínimo do cliente do Supabase:
// aceita as mesmas chamadas do painel real, mas não envia nada pra lugar nenhum.
const sb = (()=>{
  const done = Promise.resolve({data:[], error:null});
  const q = { upsert:()=>done, delete:()=>q, eq:()=>q, select:()=>q, then:(f)=>done.then(f) };
  const ch = { on:()=>ch, subscribe:()=>ch };
  return { from:()=>q, channel:()=>ch, auth:{ signOut:()=>{ location.reload(); } } };
})();

/* ===================== interface: helpers de lista e pipeline ===================== */
// Prazos e dias (colunas Total / No setor, campos de dias, filtro de dias) ficam
// escondidos porque a maioria dos projetos veio importada sem essas datas.
// Basta virar true pra voltar a mostrar.
const MOSTRAR_PRAZOS = false;
const MK_CHECK = '<svg class="icon" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>';
// Em Processos internos a segunda coluna é "Lote / quadra" (o endereço já aparece sob o cliente).
function mkLoteCol(){ return state.view==="interno"; }
// Posição do projeto na trilha ativa: n etapas, cur = índice da atual (n = concluída, -1 = não iniciada)
function mkProg(p){
  const tr = p.activeTrack;
  if(!tr) return {n:1, cur:1};
  if(LOG_TRACKS.includes(tr)){
    const cat = catalogOf(p, tr), log = p[tr+"Log"]||[], open = openEntryOf(log);
    const cur = open ? cat.findIndex(c=>c.setor===open.setor && c.motivo===open.motivo) : (log.length ? cat.length : -1);
    return {n:cat.length, cur};
  }
  const t = p.tracks[tr];
  return {n:t.steps.length, cur: t.concluida ? t.steps.length : t.currentIndex};
}
function mkDots(p){
  const g = mkProg(p); if(g.n<2) return "";
  return `<span class="mk-dots" title="Etapa ${Math.min(g.cur+1,g.n)} de ${g.n}">${Array.from({length:g.n},(_,i)=>`<i class="${i<g.cur?"d":i===g.cur?"c":""}"></i>`).join("")}</span><span class="mk-cnt">${Math.max(0,Math.min(g.cur+1,g.n))}/${g.n}</span>`;
}
// Etapa em duas linhas (setor em cima, motivo embaixo) + bolinhas do pipeline.
function mkEtapaCell(p){
  const partes = String(p.setorAtual||"").split(" — ");
  const dots = `<div class="mk-dline">${mkDots(p)}</div>`;
  if(partes.length>1) return `<td data-label="Fase / setor" class="mk-etapa"><div>${esc(partes[0])}</div><div class="mk-l2">${esc(partes.slice(1).join(" — "))}</div>${dots}</td>`;
  return `<td data-label="Fase / setor" class="mk-etapa">${esc(p.setorAtual)}${dots}</td>`;
}
// Bloqueio em pílula colorida.
function mkBloqCell(p){
  const b = p.statusBloqueio||"Ok";
  const cls = b==="Ok" ? "g" : (b==="Parado"||b==="Boleto vencido"||b.indexOf("pendência")>=0) ? "r" : "a";
  return `<td data-label="Bloqueio"><span class="mk-pl ${cls}">${esc(b)}</span></td>`;
}
// Pipeline das etapas no detalhe do projeto: linha do tempo com faixa "Agora" e
// botão Avançar. Reaproveita as ações que já existem: "step" (trilhas por etapa)
// e "passagem-opt" (trilhas por setor e motivo). Retorna null quando a trilha
// precisa do controle original (passagem de fechamento manual / sem etapas).
function mkTrackSection(p, track){
  const t = p.tracks[track];
  const isLog = LOG_TRACKS.includes(track);
  let nodes, curIdx;
  if(isLog){
    const log = p[track+"Log"]||[], open = openEntryOf(log), cat = catalogOf(p, track);
    const oc = open ? cat.find(c=>c.setor===open.setor && c.motivo===open.motivo) : null;
    if(oc && oc.fechamentoManual) return null;
    curIdx = open ? cat.indexOf(oc) : (log.length ? cat.length : -1);
    nodes = cat.map((c,i)=>({i, title:c.setor, sub:c.motivo,
      attrs: c.fechamentoManual ? "" : `data-action="passagem-opt" data-id="${p.id}" data-track="${track}" data-setor="${esc(c.setor)}" data-motivo="${esc(c.motivo)}"`}));
  } else {
    if(!t.steps.length) return null;
    curIdx = t.concluida ? t.steps.length : t.currentIndex;
    nodes = t.steps.map((label,i)=>({i, title:label, sub:"", attrs:`data-action="step" data-id="${p.id}" data-track="${track}" data-index="${i}"`}));
  }
  nodes.forEach(n=>{ n.state = n.i===curIdx ? "cur" : n.i<curIdx ? "done" : "todo"; });
  const cur = nodes[curIdx];
  const full = n=> n.title + (n.sub ? " — " + n.sub : "");
  const now = cur ? full(cur) : (curIdx>=nodes.length ? "Trilha concluída" : "Não iniciada");
  const next = nodes.slice(Math.max(curIdx+1,0)).find(n=>n.attrs);
  const adv = next ? `<button type="button" class="mk-adv" ${next.attrs}>${curIdx<0?"Iniciar":"Avançar"}<span>${esc(full(next))}</span>${ICONS.chev}</button>` : `<span class="mk-fin">${curIdx>=nodes.length?"Concluída":"Última etapa"}</span>`;
  const viz = `<div class="mk-tl">${nodes.map((n,i)=>(i?`<span class="mk-ln ${n.i<=curIdx?"d":""}"></span>`:"")+
    `<button type="button" class="mk-tn ${n.state}" ${n.attrs} title="${esc(full(n))}"><span class="mk-c">${n.state==="done"?MK_CHECK:""}</span><span class="mk-t">${esc(n.title)}</span>${n.sub?`<span class="mk-s">${esc(n.sub)}</span>`:""}</button>`).join("")}</div>`;

    ? (isLog ? renderLogFeeBox(p, track) : `<div class="fee-box" style="margin-top:14px;padding:12px 14px"><div class="field-label" style="margin-bottom:2px">Etapa de taxas</div>${feeRowModal(p,"taxaEnviada","Taxa enviada ao cliente")}${feeRowModal(p,"comprovante","Comprovante anexado")}</div>`)
    : "";

    ${viz}
    ${fee}
    ${isLog ? renderPassagemHistorico(p, track) : ""}
  </div>`;
}

/* ---- busca rápida global (sidebar, qualquer view) ---- */
const SEARCH_RESULT_LIMIT = 8;
// Minúsculas + sem acento + sem espaço em nenhuma posição, pra "São Paulo",
// "sao paulo", "SAOPAULO" e "s ã o  p a u l o" virarem todos "saopaulo" antes
// de comparar por substring. Aplicada tanto no termo digitado quanto nos
// campos do projeto.
function normalizeSearch(s){
  return (s??"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"");
}
// Relevância simples (sem fuzzy matching): 0 = começa pelo cliente, 1 =
// começa pelo endereço/nº de processo/lote-quadra, 2 = aparece no meio de
// qualquer um desses campos. loteQuadra entra de bônus junto com
// endereço/processo — é comum um projeto ainda não ter endereço formal, só
// lote e quadra, e faria falta não poder achar por ele.
function searchProjetos(query){
  const q = normalizeSearch(query);
  if(q.length<2) return [];
  const scored = [];
  for(const p of state.projetos){
    const cliente = normalizeSearch(clienteNome(p));
    const endereco = normalizeSearch(p.endereco);
    const processo = normalizeSearch(p.numeroProcesso);
    const lote = normalizeSearch(p.loteQuadra);
    let score;
    if(cliente.startsWith(q)) score = 0;
    else if(endereco.startsWith(q) || processo.startsWith(q) || lote.startsWith(q)) score = 1;
    else if(cliente.includes(q) || endereco.includes(q) || processo.includes(q) || lote.includes(q)) score = 2;
    else continue;
    scored.push({p, score});
  }
  scored.sort((a,b)=>a.score-b.score);
  return scored.map(s=>s.p);
}
// Empresa cujo nome bate melhor com a busca (usada pra oferecer "ver todos
// os processos dela" no dropdown da busca rápida, além dos projetos
// individuais encontrados).
function topEmpresaMatch(query){
  const matches = searchEmpresas(state.empresas, query, 1);
  return matches[0] || null;
}

/* ---- catálogo de empresas (cliente deixou de ser texto livre) ---- */
// "Cliente" no projeto agora é uma referência (empresaId) a este catálogo,
// não mais um texto solto — evita ter "RIL Empreendimentos" e "RIL
// Empreendimentos Imobiliários" como duas coisas diferentes por causa de
// como cada pessoa digitou. As funções abaixo recebem o array `empresas`
// explicitamente (em vez de ler state.empresas direto) porque a migração em
// loadState() precisa rodar ANTES de `state` existir.
function findEmpresaByNome(empresas, nome){
  const norm = normalizeSearch(nome);
  if(!norm) return null;
  return empresas.find(e=>normalizeSearch(e.nome)===norm) || null;
}
// Acha a empresa pelo nome normalizado ou cria uma nova — nunca duplica uma
// que já existe só porque veio com maiúscula/acento/espaço diferente.
function ensureEmpresa(empresas, nome){
  nome = (nome||"").toString().trim();
  if(!nome) return null;
  const existing = findEmpresaByNome(empresas, nome);
  if(existing) return existing;
  const emp = {id:uid(), nome}; // estrutura já preparada pra ganhar CNPJ/contato/telefone depois
  empresas.push(emp);
  syncEmpresa(emp);
  return emp;
}
// "Parecido" pro aviso de possível duplicata: um nome normalizado contém o
// outro (substring), sem ser idêntico — não precisa de fuzzy matching pra
// isso, ex: "rilempreendimentos" contém "ril" mas o inverso também vale.
function empresaSimilar(empresas, nome){
  const norm = normalizeSearch(nome);
  if(!norm) return null;
  return empresas.find(e=>{
    const en = normalizeSearch(e.nome);
    return en!==norm && (en.includes(norm) || norm.includes(en));
  }) || null;
}
function searchEmpresas(empresas, query, limit){
  const q = normalizeSearch(query);
  if(!q) return [];
  const scored = [];
  for(const e of empresas){
    const n = normalizeSearch(e.nome);
    let score;
    if(n.startsWith(q)) score = 0;
    else if(n.includes(q)) score = 1;
    else continue;
    scored.push({e, score});
  }
  scored.sort((a,b)=>a.score-b.score);
  return scored.slice(0, limit||20).map(s=>s.e);
}
// Resolve o nome de exibição do cliente de um projeto — todo lugar que hoje
// leria p.cliente direto passa a usar este helper, que resolve empresaId no
// catálogo. Mantém p.cliente como fallback só de segurança (não deveria
// mais acontecer depois da migração em loadState).
function empresaNomeById(id){
  const emp = state.empresas.find(e=>e.id===id);
  return emp ? emp.nome : "";
}
function clienteNome(p){
  return empresaNomeById(p.empresaId) || p.cliente || "(sem empresa)";
}
// Migração automática do modelo antigo (p.cliente texto solto) pro novo
// (p.empresaId referenciando o catálogo) — roda uma vez, de forma
// transparente, tanto nos 4 projetos de seed quanto em qualquer dado salvo
// no localStorage. Usa ensureEmpresa (normalização) pra não criar uma
// empresa duplicada quando dois projetos diferentes já tinham o mesmo nome
// de cliente digitado.
function migrateClienteParaEmpresa(projetos, empresas){
  for(const p of projetos){
    if(!p.empresaId && p.cliente){
      const emp = ensureEmpresa(empresas, p.cliente);
      if(emp){ p.empresaId = emp.id; delete p.cliente; }
    }
  }
}

const TRACK_OF_FASE = Object.fromEntries(Object.entries(FASE_OF_TRACK).map(([track,fase])=>[fase,track]));
const TOGGLE_OF_TRACK = {comercial:"hasComercial", elaboracao:"hasElaboracao", abertura:"hasAbertura", remembramento:"hasRemembramento", trilhaPrincipal:"hasTrilhaPrincipal", trilhaAmbiental:"hasAmbiental", trilhaHabitese:"hasHabitese"};

function cloneSteps(arr){ return arr.map(s=>({...s})); }
// Cada tipo de serviço tem sua própria trilha completa e independente. Por
// padrão só "Aprovação" passa por Ambiental/Habite-se (ver especificação) —
// os demais tipos podem ligar isso depois na aba Configurações.
function ambientalHabiteseDefaultOn(tipo){ return tipo==="Aprovação"; }
// Remembramento tem a própria trilha de prefeitura (checklist de 10 etapas) e
// por isso não passa por Licença de Obra / Ambiental / Habite-se por padrão.
function remembramentoDefaultOn(tipo){ return tipo==="Remembramento"; }
// Projeto Legal: o escritório só faz o estudo e a elaboração do projeto (plantas
// e RRT) — não abre processo nem acompanha a prefeitura. Por isso nasce só com
// Comercial e Elaboração ligadas; ao concluir a Elaboração o projeto finaliza.
function soProjetoDefaultOn(tipo){ return tipo==="Projeto Legal"; }
function buildDefaultWorkflow(tipo){
  const rem = remembramentoDefaultOn(tipo);
  const soProjeto = soProjetoDefaultOn(tipo);
  return {
    comercial: cloneSteps(DEFAULT_STEPS.comercial), elaboracao: cloneSteps(DEFAULT_STEPS.elaboracao), abertura: cloneSteps(DEFAULT_STEPS.abertura),
    remembramento: cloneSteps(DEFAULT_STEPS.remembramento),
    trilhaPrincipal: cloneSteps(DEFAULT_STEPS.trilhaPrincipal), trilhaAmbiental: cloneSteps(DEFAULT_STEPS.trilhaAmbiental), trilhaHabitese: cloneSteps(DEFAULT_STEPS.trilhaHabitese),
    hasComercial: true, hasElaboracao: true, hasAbertura: !soProjeto, hasRemembramento: rem, hasTrilhaPrincipal: !rem && !soProjeto,
    hasAmbiental: !rem && ambientalHabiteseDefaultOn(tipo), hasHabitese: !rem && ambientalHabiteseDefaultOn(tipo),
  };
}
function buildDefaultWorkflows(){
  const out = {};
  for(const tipo of TIPOS_SERVICO) out[tipo] = buildDefaultWorkflow(tipo);
  return out;
}

function wf(p){ return state.workflows[p.tipoServico] || state.workflows[TIPOS_SERVICO[0]]; }
function trackEnabled(p, track){ return wf(p)[TOGGLE_OF_TRACK[track]] !== false; }
function nextEnabledTrack(p, fromTrack){
  const idx = TRACK_ORDER.indexOf(fromTrack);
  for(let i=idx+1;i<TRACK_ORDER.length;i++){ if(trackEnabled(p, TRACK_ORDER[i])) return TRACK_ORDER[i]; }
  return null;
}
function firstEnabledTrack(p){ return TRACK_ORDER.find(t=>trackEnabled(p,t)) || null; }
function stepsOf(p, track){ return wf(p)[track].map(s=>s.label); }
// Estado do checklist de uma trilha não-reentrante (comercial/elaboração/
// abertura/ambiental): um boolean por etapa, marcável em qualquer ordem —
// independente do índice sequencial usado pra SLA/prazo (ver moveStep). Se o
// projeto ainda não tem esse registro próprio (nunca usado o checklist, só o
// seletor de etapa antigo), deriva do índice sequencial: tudo até ali marcado.
function checklistDone(p, track){
  const steps = stepsOf(p, track);
  const done = p[track+"Done"];
  if(Array.isArray(done) && done.length===steps.length) return done;
  const idx = p[track+"Index"];
  return steps.map((_,i)=> i<=idx);
}
function diasOf(p, track, index){ if(index<0) return 0; const s = wf(p)[track][index]; return s ? s.dias : 10; }
function feeOf(p, track, index){ const s = wf(p)[track][index]; return !!(s && s.fee); }

/* ---- catálogo setor+motivo (trilhaPrincipal / trilhaHabitese) ---- */
function catalogOf(p, track){ return wf(p)[track]; }
function catalogEntry(p, track, setor, motivo){ return catalogOf(p,track).find(c=>c.setor===setor && c.motivo===motivo) || null; }
function catalogIndexOfEntry(p, track, entry){ return entry ? catalogOf(p,track).findIndex(c=>c.setor===entry.setor && c.motivo===entry.motivo) : -1; }
// O último item do catálogo é sempre o que "conclui" a trilha — mesma
// convenção que já valia pra "Licença de Obra" ser o último item da lista
// antiga (chegar nele = trilha concluída).
function isCatalogFinal(p, track, setor, motivo){
  const arr = catalogOf(p,track);
  return arr.length>0 && arr[arr.length-1].setor===setor && arr[arr.length-1].motivo===motivo;
}
function nextCatalogCombo(p, track, fromSetor, fromMotivo){
  const arr = catalogOf(p, track);
  const idx = arr.findIndex(c=>c.setor===fromSetor && c.motivo===fromMotivo);
  return idx>=0 && idx<arr.length-1 ? arr[idx+1] : null;
}
function openEntryOf(log){ return log.find(l=>!l.dataSaida) || null; }
// Concluída = a última passagem do log é a combinação final do catálogo —
// não depende de "fechar" essa passagem (mesma lógica de "chegar no último
// item" que já valia no modelo antigo de índice único).
function logConcluida(p, track){
  const log = p[track+"Log"];
  if(!log || log.length===0) return false;
  const last = log[log.length-1];
  return isCatalogFinal(p, track, last.setor, last.motivo);
}
function logStatus(p, track){
  const log = p[track+"Log"] || [];
  const catalog = catalogOf(p, track);
  const total = catalog.length;
  const concluida = logConcluida(p, track);
  const open = openEntryOf(log);
  let status, pct, setorLabel, currentIndex;
  if(concluida){
    const last = log[log.length-1];
    status = "Concluída"; pct = 100; setorLabel = `${last.setor} — ${last.motivo}`;
    currentIndex = total-1;
  } else if(!open){
    status = log.length>0 ? "Aguardando próxima passagem" : "Não iniciada";
    pct = 0; setorLabel = "—"; currentIndex = -1;
  } else {
    status = "Em andamento";
    currentIndex = catalogIndexOfEntry(p, track, open);
    pct = total>1 && currentIndex>=0 ? Math.round((currentIndex/(total-1))*100) : (log.length>0 ? 10 : 0);
    setorLabel = `${open.setor} — ${open.motivo}`;
  }
  return {steps: catalog.map(c=>`${c.setor} — ${c.motivo}`), currentIndex, concluida, status, pct, setorLabel, open, log};
}

function prazoParaEtapa(p, track, index){ if(index<0) return 0; return diasOf(p, track, index); }
function calcSemaforo(diasSetor, prazoSetor){ if(!prazoSetor) return null; if(diasSetor>prazoSetor) return "red"; if(diasSetor>=prazoSetor*0.8) return "yellow"; return "green"; }
function trilhaStatus(p, track, currentIndex, concluida){
  const steps = stepsOf(p, track); const total = steps.length;
  let status, pct;
  if(total===0){ status="—"; pct=0; }
  else if(concluida){ status="Concluída"; pct=100; }
  else if(currentIndex<0){ status="Não iniciada"; pct=0; }
  else { status="Em andamento"; pct = total>1 ? Math.round((currentIndex/(total-1))*100) : 100; }
  const setorLabel = total===0 ? "—" : concluida ? steps[total-1] : currentIndex<0 ? "—" : steps[currentIndex];
  return {steps,currentIndex,concluida,status,pct,setorLabel};
}
function hasFeeStep(p,track,index){ return feeOf(p, track, index); }
function initials(name){ return name ? name.slice(0,2).toUpperCase() : "—"; }
const SEMAFORO_COLORS = {
  red:{bg:"var(--red-bg)",fg:"var(--red-ink)",dot:"var(--red-solid)"},
  yellow:{bg:"var(--amber-bg)",fg:"var(--amber-ink)",dot:"var(--amber-solid)"},
  green:{bg:"var(--green-bg)",fg:"var(--green-ink)",dot:"var(--green-solid)"},
};
function semaforoChip(s){ return s ? SEMAFORO_COLORS[s] : {bg:"var(--tag)",fg:"var(--ink-soft)"}; }
function semaforoDot(s){ return s ? SEMAFORO_COLORS[s].dot : "rgba(28,26,23,.25)"; }
function fmtDate(d){ if(!d) return null; const dt=new Date(d); return dt.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
// usado só no Histórico: DD/MM/AA - HH:MM
function fmtDateTime(d){
  if(!d) return null;
  const dt = new Date(d);
  const data = fmtDate(d).slice(0,6)+String(dt.getFullYear()).slice(-2);
  const hh = String(dt.getHours()).padStart(2,"0");
  const mi = String(dt.getMinutes()).padStart(2,"0");
  return `${data} - ${hh}:${mi}`;
}
function diasEntre(a,b){ return Math.max(0, Math.floor((b-a)/86400000)); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
// Estrutura de controle de taxa (boleto enviado / comprovante) anexada a uma
// passagem de trilha reentrante quando o combo do catálogo tem fee:true —
// usada tanto ao abrir a passagem quanto ao importar uma linha de CSV.
function buildFeeObject(){
  return { boleto:{checked:false,data:null,autor:null}, comprovante:{checked:false,data:null,autor:null} };
}

/* ===================== CSV (exportar/importar) ===================== */
// Decisão de formato do CSV pra trilhaPrincipal/trilhaHabitese (agora log de
// passagens, não mais índice único): exportamos o log inteiro como JSON
// dentro de uma única coluna (trilhaPrincipalLog/trilhaHabiteseLog) — mais
// simples de manter no parser atual do que "explodir" em várias linhas por
// projeto, e o parser de CSV já lida bem com aspas/vírgulas dentro de um
// campo citado. Pra popular manualmente a PRIMEIRA passagem de um projeto já
// em andamento (migração dos dados reais), aceitamos 3 colunas extras por
// trilha (setor atual / motivo atual / data de entrada) — usadas só quando a
// coluna de log JSON daquela trilha vier vazia na linha.
const CSV_HEADERS = ["id","empresaNome","endereco","loteQuadra","tipoServico","fase","responsavel","statusBloqueio",
  "numeroProcesso","numeroIptu","dataContrato","dataEntradaSetorAtual",
  "comercialIndex","comercialConcluida","elaboracaoIndex","elaboracaoConcluida","aberturaIndex","aberturaConcluida","remembramentoIndex","remembramentoConcluida",
  "trilhaPrincipalLog","trilhaPrincipalSetorAtual","trilhaPrincipalMotivoAtual","trilhaPrincipalDataEntradaAtual",
  "trilhaHabiteseLog","trilhaHabiteseSetorAtual","trilhaHabiteseMotivoAtual","trilhaHabiteseDataEntradaAtual",
  "trilhaAmbientalIndex","trilhaAmbientalConcluida",
  "taxaEnviadaChecked","taxaEnviadaData","taxaEnviadaAutor","comprovanteChecked","comprovanteData","comprovanteAutor",
  "finalizado","infoBasicas","diasTotal","diasSetor"];

// trilhas que usam índice + "concluída" no CSV (as de log de passagens têm
// colunas próprias)
const CSV_INDEX_TRACKS = TRACK_KEYS.filter(t=>!LOG_TRACKS.includes(t));

function csvEscape(v){
  v = v===null||v===undefined ? "" : String(v);
  return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v;
}
function buildCSV(rows){ return rows.map(r=>r.map(csvEscape).join(",")).join("\r\n"); }

// parser simples de CSV: aspas duplas, vírgulas/quebras de linha dentro de campos citados
function parseCSV(text){
  const rows = []; let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ",") { row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* ignora, \n trata a quebra */ }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length===1 && r[0].trim()===""));
}

function projetoToRow(p){
  const enriched = enrich(p);
  const abertaPrincipal = openEntryOf(p.trilhaPrincipalLog||[]);
  const abertaHabitese = openEntryOf(p.trilhaHabiteseLog||[]);
  return [p.id,clienteNome(p),p.endereco,p.loteQuadra||"",p.tipoServico,p.fase,p.responsavel||"",p.statusBloqueio,
    p.numeroProcesso||"",p.numeroIptu||"",(p.dataContrato||"").slice(0,10),(p.dataEntradaSetorAtual||"").slice(0,10),
    p.comercialIndex,p.comercialConcluida,p.elaboracaoIndex,p.elaboracaoConcluida,p.aberturaIndex,p.aberturaConcluida,p.remembramentoIndex,p.remembramentoConcluida,
    JSON.stringify(p.trilhaPrincipalLog||[]), abertaPrincipal?abertaPrincipal.setor:"", abertaPrincipal?abertaPrincipal.motivo:"", abertaPrincipal?(abertaPrincipal.dataEntrada||"").slice(0,10):"",
    JSON.stringify(p.trilhaHabiteseLog||[]), abertaHabitese?abertaHabitese.setor:"", abertaHabitese?abertaHabitese.motivo:"", abertaHabitese?(abertaHabitese.dataEntrada||"").slice(0,10):"",
    p.trilhaAmbientalIndex,p.trilhaAmbientalConcluida,
    p.taxaEnviada.checked,p.taxaEnviada.data||"",p.taxaEnviada.autor||"",
    p.comprovante.checked,p.comprovante.data||"",p.comprovante.autor||"",
    p.finalizado,p.infoBasicas||"",enriched.diasTotal,enriched.diasSetor];
}

function toBool(v){ return String(v).trim().toLowerCase()==="true"; }
function toInt(v,def){ const n = parseInt(v,10); return isNaN(n) ? def : n; }

// Monta o log de uma trilha reentrante (trilhaPrincipal/trilhaHabitese) a
// partir de uma linha de CSV: usa a coluna de log JSON se ela vier
// preenchida (migração completa), senão tenta popular UMA passagem inicial a
// partir das colunas setor/motivo/data (migração manual de um projeto já em
// andamento). Valida setor contra o catálogo de setores fechado e motivo
// contra o catálogo daquele tipo de serviço — rejeita a linha se não bater.
function parseLogColumn(track, cols, workflow, existing){
  const {jsonCol, setorCol, motivoCol, dataCol} = cols;
  if(jsonCol && jsonCol.trim()){
    let parsed;
    try{ parsed = JSON.parse(jsonCol); }catch(e){ return {error:`${track}Log: JSON inválido`}; }
    if(!Array.isArray(parsed)) return {error:`${track}Log: formato inválido (esperado um array)`};
    return {log: parsed};
  }
  if(setorCol){
    if(!SETORES.includes(setorCol)) return {error:`${track}: setor "${setorCol}" não existe no catálogo de setores`};
    const combo = workflow[track].find(c=>c.setor===setorCol && c.motivo===motivoCol);
    if(!combo) return {error:`${track}: motivo "${motivoCol}" não é válido para o setor "${setorCol}" no catálogo deste tipo de serviço`};
    return {log:[{id:uid(), setor:setorCol, motivo:motivoCol, responsavel:null,
      dataEntrada: dataCol ? new Date(dataCol).toISOString() : new Date().toISOString(), dataSaida:null, ordemSequencial:1,
      diasEsperado: combo.semSla ? 0 : combo.dias,
      ...(combo.fee ? {fee:buildFeeObject()} : {})}]};
  }
  return {log: existing ? existing[track+"Log"] : []};
}

// Atualiza um projeto existente (casado pelo `id`) ou cria um novo a partir de
// uma linha do CSV. Comentários/histórico/modificações não fazem parte do CSV
// e permanecem intactos num projeto já existente. Retorna {status} em caso
// de sucesso ou {status:"error", error} se a linha for rejeitada.
function importRow(obj){
  const existing = obj.id ? findProjeto(obj.id) : null;
  const tipoServico = obj.tipoServico || (existing ? existing.tipoServico : TIPOS_SERVICO[0]);
  const workflow = state.workflows[tipoServico] || state.workflows[TIPOS_SERVICO[0]];

  const principal = parseLogColumn("trilhaPrincipal", {jsonCol: obj.trilhaPrincipalLog, setorCol: obj.trilhaPrincipalSetorAtual, motivoCol: obj.trilhaPrincipalMotivoAtual, dataCol: obj.trilhaPrincipalDataEntradaAtual}, workflow, existing);
  if(principal.error) return {status:"error", error: principal.error};
  const habitese = parseLogColumn("trilhaHabitese", {jsonCol: obj.trilhaHabiteseLog, setorCol: obj.trilhaHabiteseSetorAtual, motivoCol: obj.trilhaHabiteseMotivoAtual, dataCol: obj.trilhaHabiteseDataEntradaAtual}, workflow, existing);
  if(habitese.error) return {status:"error", error: habitese.error};

  // "cliente" aceito como sinônimo de "empresaNome" pra CSVs exportados antes
  // dessa mudança continuarem importáveis. Resolve/cria no catálogo de
  // empresas do mesmo jeito que a migração automática (ensureEmpresa,
  // normalizado) — nunca duplica uma empresa que já existe por nome.
  const empresaNomeCol = (obj.empresaNome || obj.cliente || "").trim();
  let empresaId = existing ? existing.empresaId : null;
  if(empresaNomeCol) empresaId = ensureEmpresa(state.empresas, empresaNomeCol).id;
  else if(!existing) empresaId = ensureEmpresa(state.empresas, "(sem nome)").id;

  const common = {
    taxaEnviada: { checked: toBool(obj.taxaEnviadaChecked), data: obj.taxaEnviadaData||null, autor: obj.taxaEnviadaAutor||null },
    comprovante: { checked: toBool(obj.comprovanteChecked), data: obj.comprovanteData||null, autor: obj.comprovanteAutor||null },
    finalizado: toBool(obj.finalizado),
    trilhaPrincipalLog: principal.log, trilhaHabiteseLog: habitese.log,
  };
  for(const t of CSV_INDEX_TRACKS) common[t+"Concluida"] = toBool(obj[t+"Concluida"]);
  if(existing) return updateProjetoFromImport(existing, obj, tipoServico, empresaId, common);
  return createProjetoFromImport(obj, tipoServico, empresaId, common);
}
function updateProjetoFromImport(existing, obj, tipoServico, empresaId, common){
  for(const t of CSV_INDEX_TRACKS) common[t+"Index"] = toInt(obj[t+"Index"], existing[t+"Index"]);
  Object.assign(existing, {
    empresaId, endereco: obj.endereco||existing.endereco, loteQuadra: obj.loteQuadra||null,
    tipoServico,
    fase: obj.fase||existing.fase, responsavel: obj.responsavel||null, statusBloqueio: obj.statusBloqueio||existing.statusBloqueio,
    faseDesde: (obj.fase && obj.fase!==existing.fase) ? new Date().toISOString() : existing.faseDesde,
    numeroProcesso: obj.numeroProcesso||null, numeroIptu: obj.numeroIptu||null, infoBasicas: obj.infoBasicas||null, ...common,
  });
  pushLog(existing, `${state.currentUser} atualizou o projeto via importação de CSV`);
  syncProjeto(existing);
  return {status:"updated"};
}
function createProjetoFromImport(obj, tipoServico, empresaId, common){
  for(const t of CSV_INDEX_TRACKS) common[t+"Index"] = toInt(obj[t+"Index"], -1);
  const novo = {
    id: uid(), empresaId, endereco: obj.endereco||"", loteQuadra: obj.loteQuadra||null,
    tipoServico,
    dataContrato: obj.dataContrato ? new Date(obj.dataContrato).toISOString() : new Date().toISOString(),
    numeroProcesso: obj.numeroProcesso||null, numeroIptu: obj.numeroIptu||null, fase: obj.fase||"contrato", responsavel: obj.responsavel||null,
    statusBloqueio: obj.statusBloqueio||"Ok",
    dataEntradaSetorAtual: obj.dataEntradaSetorAtual ? new Date(obj.dataEntradaSetorAtual).toISOString() : new Date().toISOString(),
    infoBasicas: obj.infoBasicas||null, ...common,
    comments: [], log: [{id:uid(), texto:`${state.currentUser} importou este projeto via CSV`, data: fmtDateTime(new Date())}],
  };
  novo.faseDesde = novo.dataEntradaSetorAtual; // projeto importado: usa a data de entrada informada na planilha
  state.projetos.push(novo);
  syncProjeto(novo);
  return {status:"created"};
}

function exportCSV(){
  const rows = [CSV_HEADERS, ...state.projetos.map(projetoToRow)];
  const csv = buildCSV(rows);
  try{
    // download padrão do navegador: cria um link temporário apontando pra um
    // Blob e simula o clique — funciona em qualquer site normal (não
    // depende do ambiente de teste do Claude, que tinha sua própria API).
    const blob = new Blob(["﻿"+csv], {type: "text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `projetos-${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch(err){ alert("Não foi possível gerar o arquivo" + (err&&err.message?": "+err.message:".")); }
}

function importCSV(file){
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result));
    if(rows.length<2){ alert("Nenhuma linha de dados encontrada no CSV."); return; }
    const headers = rows[0].map(h=>h.trim());
    let created=0, updated=0, erros=0; const errorMsgs=[];
    rows.slice(1).forEach(r=>{
      const obj = {}; headers.forEach((h,i)=>{ obj[h] = r[i]!==undefined ? r[i] : ""; });
      const result = importRow(obj);
      if(result.status==="created") created++;
      else if(result.status==="updated") updated++;
      else { erros++; errorMsgs.push(`${obj.empresaNome||obj.cliente||obj.id||"(linha sem empresa/id)"}: ${result.error}`); }
    });
    save();
    let msg = `Importação concluída: ${created} projeto(s) novo(s), ${updated} atualizado(s).`;
    if(erros>0) msg += `\n${erros} linha(s) rejeitada(s):\n` + errorMsgs.slice(0,10).join("\n") + (errorMsgs.length>10?`\n...e mais ${errorMsgs.length-10}`:"");
    alert(msg);
  };
  reader.onerror = () => alert("Não foi possível ler o arquivo.");
  reader.readAsText(file, "UTF-8");
}

/* ===================== estado ===================== */
const STORAGE_KEY = "gestao-projetos-demo-v1";
// Garante que projetos salvos numa versão anterior do painel não quebrem a
// renderização quando faltar um campo novo.
// "DD/MM/AA - HH:MM" (formato do histórico) -> "DD/MM/AAAA" (formato dos comentários)
function dataCurtaDeDateTime(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{2})/.exec(str||"");
  return m ? `${m[1]}/${m[2]}/20${m[3]}` : (str||"");
}
function normalizeProjeto(p){
  if(!Array.isArray(p.radar)) p.radar = [];
  if(!Array.isArray(p.comments)) p.comments = [];
  p.comments = p.comments.map(c=>({tipo:"nota", rev:null, observacao:false, mencionado:null, resolvida:false, dataResolucao:null, ...c}));
  for(const c of p.comments){ if(c.tipo==="modificacao" && !SOLICITANTE_LABEL[c.solicitante]) c.solicitante = "cliente"; }
  // "Modificações" deixou de ser uma seção própria: os pedidos antigos viram
  // comentários do tipo "Modificação de projeto" (quem pediu: Cliente) (mesmo id, então a
  // migração é idempotente). Sem esse pedido, nada mais move o projeto sozinho.
  if(Array.isArray(p.modificacoes)){
    for(const m of p.modificacoes){
      if(p.comments.some(c=>c.id===m.id)) continue;
      p.comments.push({id:m.id, autor:m.autor, texto:m.descricao, data:dataCurtaDeDateTime(m.data), tipo:"modificacao", solicitante:"cliente",
        observacao:true, mencionado:null, resolvida:!!m.resolvida, dataResolucao:m.resolvida ? dataCurtaDeDateTime(m.dataResolucao) : null});
    }
    p.comments.sort((a,b)=> parseBRDate(b.data) - parseBRDate(a.data)); // mais recentes primeiro, como o resto da lista
  }
  delete p.modificacoes;
  if(!Array.isArray(p.log)) p.log = [];
  if(p.infoBasicas === undefined) p.infoBasicas = null;
  if(p.loteQuadra === undefined) p.loteQuadra = null;
  if(p.numeroIptu === undefined) p.numeroIptu = null;
  // projetos de antes desse campo existir: a melhor aproximação de "quando
  // entrou na fase atual" é a data de entrada no setor atual (já importada
  // das planilhas); a partir daí o valor é mantido por setFase.
  if(!p.faseDesde) p.faseDesde = p.dataEntradaSetorAtual || p.dataContrato || null;
  delete p.trilhaPrincipalStatus;
  // trilhaPrincipal/trilhaHabitese trocaram de índice único pra log de
  // passagens (setores reentrantes). Não migramos automaticamente dados
  // salvos no modelo antigo (trilhaPrincipalIndex/Concluida) aqui — isso é
  // feito manualmente via importação de CSV depois que o catálogo estiver
  // configurado. Só garantimos que o log exista, pra não quebrar a
  // renderização enquanto isso não acontece.
  if(!Array.isArray(p.trilhaPrincipalLog)) p.trilhaPrincipalLog = [];
  if(!Array.isArray(p.trilhaHabiteseLog)) p.trilhaHabiteseLog = [];
  for(const t of TRACK_KEYS){
    if(LOG_TRACKS.includes(t)) continue;
    if(typeof p[t+"Index"] !== "number") p[t+"Index"] = -1;
    if(typeof p[t+"Concluida"] !== "boolean") p[t+"Concluida"] = false;
  }
  return p;
}
// Garante que a configuração de UM tipo de serviço tenha todos os campos
// atuais — configs salvas antes de uma trilha existir (ex: Remembramento)
// ganham os padrões dela aqui, sem perder o que já estava configurado.
function normalizeWorkflowOf(tipo, w){
  if(!w || !Array.isArray(w.comercial)) return buildDefaultWorkflow(tipo);
  if(typeof w.hasComercial !== "boolean") w.hasComercial = true;
  if(typeof w.hasElaboracao !== "boolean") w.hasElaboracao = true;
  if(typeof w.hasAbertura !== "boolean") w.hasAbertura = !soProjetoDefaultOn(tipo);
  if(typeof w.hasTrilhaPrincipal !== "boolean") w.hasTrilhaPrincipal = !soProjetoDefaultOn(tipo);
  if(typeof w.hasAmbiental !== "boolean") w.hasAmbiental = ambientalHabiteseDefaultOn(tipo);
  if(typeof w.hasHabitese !== "boolean") w.hasHabitese = ambientalHabiteseDefaultOn(tipo);
  if(!Array.isArray(w.remembramento)) w.remembramento = cloneSteps(DEFAULT_STEPS.remembramento);
  if(typeof w.hasRemembramento !== "boolean"){
    // primeira vez que essa config é vista depois da trilha Remembramento
    // existir: liga a trilha só pro tipo Remembramento e, pra ele, troca a
    // tramitação de Licença de Obra/Ambiental/Habite-se pela trilha própria.
    // (Quem quiser o contrário religa em Configurações — e a escolha vale a
    // partir daí, porque o campo passa a existir.)
    w.hasRemembramento = remembramentoDefaultOn(tipo);
    if(w.hasRemembramento){ w.hasTrilhaPrincipal = false; w.hasAmbiental = false; w.hasHabitese = false; }
  }
  return w;
}
function normalizeWorkflows(workflows){
  const out = workflows && typeof workflows==="object" ? workflows : {};
  for(const tipo of TIPOS_SERVICO) out[tipo] = normalizeWorkflowOf(tipo, out[tipo]);
  return out;
}
// Depois de uma mudança estrutural numa trilha (adicionar/remover/reordenar
// etapa, ou ligar/desligar Ambiental/Habite-se) garante que nenhum projeto
// fique com um índice fora do intervalo válido daquela trilha.
function clampProjectIndices(){
  for(const p of state.projetos){
    const w = wf(p);
    for(const t of TRACK_KEYS){
      if(LOG_TRACKS.includes(t)) continue; // log de passagens não usa índice — nada a "clampar"
      const len = w[t].length;
      if(len===0){ p[t+"Index"]=-1; p[t+"Concluida"]=false; continue; }
      if(p[t+"Index"] >= len){ p[t+"Index"] = len-1; }
      if(p[t+"Index"] !== len-1){ p[t+"Concluida"] = false; }
    }
  }
}
function defaultEmpresaPicker(){ return {query:"", selectedId:null}; }
// projetos/empresas/workflows agora vivem no Supabase — são os dados
// compartilhados pela equipe toda, carregados depois do login (ver
// loadSharedData). O que fica salvo no navegador de cada pessoa aqui é só
// preferência de UI (view atual, filtros, aba escolhida), pra continuar de
// onde parou ao recarregar a página — nunca dado de projeto.

    openId:null, openTab:"projeto", editingHeader:false, commentDraft:"", commentTipo:"nota", commentSolicitante:"cliente", commentRev:"", commentMencionado:"",
    showNovo:false, historicoOpen:false, sortBy:"fase", navOpen:{interno:true, trilhas:true}, mineOpen:{notas:false, radar:false, mencoes:false}, cfgTab:"dados", fmenu:null, radarOpen:false, radarPessoa:"", radarMotivo:"", notas:[], notaDraft:"", notaProjetoDraft:"", diarioOpen:false, diarioDia:null, diarioMes:null, editNota:null, editComment:null, focusEdit:false, focusSel:null };
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.filters) base.filters = parsed.filters;
      if(SORT_OPTS.some(o=>o.key===parsed.sortBy)) base.sortBy = parsed.sortBy;
      if(parsed.navOpen) base.navOpen = {...base.navOpen, ...parsed.navOpen};
      if(parsed.mineOpen) base.mineOpen = {...base.mineOpen, ...parsed.mineOpen};
      if(parsed.cfgTab) base.cfgTab = parsed.cfgTab;
      if(parsed.view) base.view = parsed.view;
      if(parsed.layout) base.layout = parsed.layout;
      if(parsed.internoTab) base.internoTab = parsed.internoTab;
      if(parsed.trilhaTab) base.trilhaTab = parsed.trilhaTab;
      if(parsed.configTipo) base.configTipo = parsed.configTipo;
    }
  }catch(e){}
  return base;
}
let state = loadState();
// Só as preferências de UI são salvas no navegador — dados de projeto vivem
// no Supabase e são sincronizados à parte (ver syncProjeto/syncEmpresa/syncWorkflow).
function save(){
  const {filters, view, layout, internoTab, trilhaTab, configTipo, sortBy, navOpen, mineOpen, cfgTab} = state;
  localStorage.setItem(STORAGE_KEY, JSON.stringify({filters, view, layout, internoTab, trilhaTab, configTipo, sortBy, navOpen, mineOpen, cfgTab}));

function setState(patch){ Object.assign(state, patch); save(); }

/* ---- sincronização com o Supabase (dados compartilhados pela equipe) ---- */
// Cada projeto/empresa/workflow é uma linha própria (id/tipo + o objeto
// inteiro em JSONB) — upsert individual em vez de reescrever tudo, pra duas
// pessoas mexendo em projetos diferentes ao mesmo tempo não pisarem uma na
// outra. Falha de rede aqui não trava a UI (que já foi atualizada local e
// otimisticamente) — mas, se o servidor recusar a gravação, aparece um aviso
// vermelho no topo da tela (ver reportSyncError), pra ninguém achar que
// salvou algo que não foi salvo.
function reportSyncError(what, error){
  console.error(`Falha ao sincronizar ${what}:`, error);
  if(state.syncError) return; // um aviso de cada vez, sem inundar a tela
  const motivo = (error && (error.message || error.code)) || "erro desconhecido";
  state.syncError = `Não foi possível salvar ${what} no servidor (${motivo}). O que você acabou de fazer pode não ter sido gravado — recarregue a página e confira antes de continuar.`;
  render();
}
function syncProjeto(p){
  p.updatedAt = new Date().toISOString(); // base da ordenação "última modificação"
  sb.from("projetos").upsert({id:p.id, data:p, updated_at:new Date().toISOString()})
    .then(({error})=>{ if(error) reportSyncError("o projeto", error); });
}
function syncEmpresa(e){
  sb.from("empresas").upsert({id:e.id, data:e, updated_at:new Date().toISOString()})
    .then(({error})=>{ if(error) reportSyncError("a empresa", error); });
}
function syncWorkflow(tipo){
  sb.from("workflows").upsert({tipo, data:state.workflows[tipo], updated_at:new Date().toISOString()})
    .then(({error})=>{ if(error) reportSyncError("a configuração", error); });
}
// Carrega projetos/empresas/workflows do Supabase pra dentro de state — só
// roda depois do login (ver boot/afterLogin). Reaplica os mesmos
// normalizadores que antes rodavam em cima do localStorage, pra dados
// salvos num formato mais antigo não quebrarem a renderização.
// Notas rápidas são pessoais: só as do usuário logado. Se a tabela `notas` ainda
// não existir no Supabase, a falha é ignorada e o painel segue normalmente.
async function loadNotas(){
  try{
    const res = await sb.from("notas").select("data").eq("autor", state.currentUser);
    const linhas = res.error ? [] : (res.data||[]).map(r=>r.data);
    // a ordem do radar mora numa linha especial da mesma tabela (não é uma nota)
    for(const tipo of ["radar","mencoes"]){
      const ord = linhas.find(d=>d && d.tipo===tipo+"Ordem");
      if(ord) salvarOrdem(tipo, state.currentUser, ord.ids||[], false);
    }
    state.notas = linhas.filter(d=>!(d && /Ordem$/.test(d.tipo||"")));
  }catch(e){ state.notas = []; }
}
async function loadSharedData(){
  const [projetosRes, empresasRes, workflowsRes] = await Promise.all([
    sb.from("projetos").select("data"),
    sb.from("empresas").select("data"),
    sb.from("workflows").select("tipo, data"),
  ]);
  if(projetosRes.error) throw projetosRes.error;
  if(empresasRes.error) throw empresasRes.error;
  if(workflowsRes.error) throw workflowsRes.error;
  state.projetos = projetosRes.data.map(r=>normalizeProjeto(r.data));
  state.empresas = empresasRes.data.map(r=>r.data);
  migrateClienteParaEmpresa(state.projetos, state.empresas);
  const workflows = {};
  for(const row of workflowsRes.data) workflows[row.tipo] = row.data;
  state.workflows = normalizeWorkflows(workflows);
  await loadNotas();
  // primeira vez que alguém usa o painel (tabela workflows ainda vazia) ou um
  // tipo de serviço novo sem configuração própria: semeia os padrões de
  // fábrica e já sobe pro Supabase, pra todo mundo partir do mesmo lugar.
  for(const tipo of TIPOS_SERVICO) if(!workflowsRes.data.some(r=>r.tipo===tipo)) syncWorkflow(tipo);
}
// Qualquer mudança feita por QUALQUER pessoa logada nessas 3 tabelas chega
// aqui em tempo real (inclusive as que a própria aba disparou, via
// syncProjeto/syncEmpresa/syncWorkflow acima — reaplicar os mesmos dados por
// cima é inofensivo). Atualiza o state local e re-renderiza.
// afterLogin pode disparar mais de uma vez pro mesmo login (o Supabase às
// vezes emite INITIAL_SESSION e SIGNED_IN em seguida) — sem essa guarda, a
// segunda chamada tentava religar callbacks num canal que já estava
// inscrito, o que quebra ("cannot add postgres_changes callbacks... after
// subscribe()") e trava o carregamento do painel.
let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel("painel-sync")
    .on("postgres_changes", {event:"*", schema:"public", table:"projetos"}, ({eventType, new:novo, old})=>{
      if(eventType==="DELETE"){
        state.projetos = state.projetos.filter(p=>p.id!==old.id);
        // outra pessoa excluiu o projeto que está aberto aqui: fecha o modal
        if(state.openId===old.id) Object.assign(state, closeModalState());
        if(lastAction && lastAction.projetoId===old.id) lastAction = null;
      }
      else{
        const p = normalizeProjeto(novo.data);
        const idx = state.projetos.findIndex(x=>x.id===p.id);
        if(idx>=0) state.projetos[idx] = p; else state.projetos.push(p);
      }
      render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"empresas"}, ({eventType, new:novo, old})=>{
      if(eventType==="DELETE"){ state.empresas = state.empresas.filter(e=>e.id!==old.id); }
      else{
        const idx = state.empresas.findIndex(x=>x.id===novo.data.id);
        if(idx>=0) state.empresas[idx] = novo.data; else state.empresas.push(novo.data);
      }
      render();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"workflows"}, ({eventType, new:novo, old})=>{
      if(eventType==="DELETE"){ delete state.workflows[old.tipo]; }
      else{ state.workflows[novo.tipo] = normalizeWorkflowOf(novo.tipo, novo.data); }
      render();
    })
    .subscribe();
}
// Edições na aba Configurações ficam num rascunho em memória até o usuário
// clicar em "Salvar alterações" — só nesse momento vão pro localStorage.
// (Evita perder trabalho por engano e evita depender de confirm()/alert(),
// que não funcionam dentro do iframe sandboxado do Artifact.)
function draftWorkflow(tipo){
  if(!state.configDraft || state.configDraft.tipo!==tipo){
    state.configDraft = { tipo, workflow: JSON.parse(JSON.stringify(state.workflows[tipo])) };
  }
  return state.configDraft.workflow;
}
function activeWorkflow(tipo){
  return (state.configDraft && state.configDraft.tipo===tipo) ? state.configDraft.workflow : state.workflows[tipo];
}

/* ===================== ações de domínio ===================== */
function findProjeto(id){ return state.projetos.find(x=>x.id===id) || null; }
// Muda a fase do projeto e registra QUANDO ele entrou nela (faseDesde) — é o
// que ordena as listas, dos que entraram na trilha mais recentemente aos mais
// antigos. Se a fase não mudou, não mexe na data.
function setFase(p, fase){
  if(p.fase === fase) return;
  p.fase = fase;
  p.faseDesde = new Date().toISOString();
}
function pushLog(p, texto){ p.log.unshift({id:uid(), texto, data: fmtDateTime(new Date())}); }

/* ---- desfazer última ação ---- */
// Guarda uma cópia completa do projeto logo ANTES de cada ação que o
// modifica — desfazer restaura o projeto inteiro pra esse ponto (índices,
// checklist, fase, histórico, tudo), em vez de tentar reverter campo por
// campo. O botão fica sempre visível na tela (fixo, não some sozinho);
// só fica desabilitado quando não há nenhuma ação recente pra desfazer.
let lastAction = null;
// Quando foi a última ação que mexeu num projeto — usado pra ignorar cliques
// "fantasma" logo depois (ver a ação "open" em CLICK_ACTIONS).
let lastMutationAt = 0;
function captureUndo(p, label){
  lastMutationAt = Date.now();
  lastAction = { projetoId: p.id, label, snapshot: JSON.parse(JSON.stringify(p)) };
}
function undoLastAction(){
  if(!lastAction) return;
  const p = findProjeto(lastAction.projetoId);
  if(p){
    // restaura o projeto INTEIRO: campos que a ação criou e que não existiam
    // no "antes" (ex: o checklist da trilha, a data de entrada na fase) saem
    for(const k of Object.keys(p)) if(!(k in lastAction.snapshot)) delete p[k];
    Object.assign(p, lastAction.snapshot);
    pushLog(p, `${state.currentUser} desfez a última ação: "${lastAction.label}"`);
    syncProjeto(p);
  }
  lastAction = null;
  save();
}

// Avança pra próxima trilha ligada (config por tipo de serviço) depois que
// `fromTrack` foi concluída; se não houver mais nenhuma ligada, finaliza o
// projeto. Usado por todo gatilho automático de mudança de trilha.
function advanceTrack(p, fromTrack, doneMsg){
  const next = nextEnabledTrack(p, fromTrack);
  if(next){
    setFase(p, FASE_OF_TRACK[next]);
    if(LOG_TRACKS.includes(next)){
      if((p[next+"Log"]||[]).length===0){
        const first = catalogOf(p, next)[0];
        if(first) openPassagem(p, next, first.setor, first.motivo, {auto:true, silent:true});
        pushLog(p, `${doneMsg ? doneMsg+" — " : ""}${TRACK_LABEL[next]} iniciada automaticamente`);
      }
    } else if(p[next+"Index"] < 0){
      p[next+"Index"] = 0;
      // trilha que acabou de começar: checklist todo desmarcado (sem isso, o
      // índice 0 faria o primeiro item aparecer como já marcado)
      p[next+"Done"] = stepsOf(p, next).map(()=>false);
      pushLog(p, `${doneMsg ? doneMsg+" — " : ""}${TRACK_LABEL[next]} iniciada automaticamente`);
    }
  } else {
    p.finalizado = true; setFase(p, "finalizado");
    pushLog(p, `${doneMsg ? doneMsg+" — " : ""}projeto finalizado`);
  }
}

// Abre uma nova passagem numa trilha reentrante (trilhaPrincipal/
// trilhaHabitese): fecha a passagem aberta atual (se houver) e empilha uma
// nova linha no log — nunca sobrescreve uma passagem anterior, mesmo que o
// setor se repita (SAP/SGU/SEMEF passam pelo processo mais de uma vez).
function openPassagem(p, track, setor, motivo, opts){
  opts = opts || {};
  const combo = catalogEntry(p, track, setor, motivo);
  if(!combo) return;
  if(!Array.isArray(p[track+"Log"])) p[track+"Log"] = [];
  const log = p[track+"Log"];
  const now = new Date();
  const open = openEntryOf(log);
  if(open) open.dataSaida = now.toISOString();
  const entry = {
    id: uid(), setor, motivo, responsavel: opts.auto ? null : state.currentUser,
    dataEntrada: now.toISOString(), dataSaida: null, ordemSequencial: log.length+1,
    diasEsperado: combo.semSla ? 0 : combo.dias,
  };
  if(combo.fee) entry.fee = buildFeeObject();
  log.push(entry);
  const faseDe = FASE_OF_TRACK[track];
  if(faseDe) setFase(p, faseDe);
  if(!opts.silent) pushLog(p, `${state.currentUser} moveu ${TRACK_LABEL[track]} para "${setor} — ${motivo}"`);
}

// Ponto de entrada de qualquer avanço/retrocesso manual em trilhaPrincipal ou
// trilhaHabitese — equivalente ao moveStep(track,index) das outras trilhas,
// mas escolhendo setor+motivo em vez de um índice único.
function moveStepLog(projetoId, track, setor, motivo){
  const p = findProjeto(projetoId); if(!p) return;
  captureUndo(p, `Mover ${TRACK_LABEL[track]} para "${setor} — ${motivo}"`);
  openPassagem(p, track, setor, motivo);
  if(logConcluida(p, track)){
    if(track==="trilhaPrincipal") advanceTrack(p, "trilhaPrincipal", "Licença de Obra emitida");
    else if(track==="trilhaHabitese") advanceTrack(p, "trilhaHabitese", "Certidão de Habite-se assinada");
  }
  syncProjeto(p);
  save();
}

// O que fazer quando a última etapa de cada trilha (não-reentrante) é
// concluída — chamado só quando concluida===true em moveStep.
const MOVE_STEP_ON_CONCLUIDA = {
  comercial: (p)=> advanceTrack(p, "comercial", "Comercial concluído"),
  elaboracao: (p)=> advanceTrack(p, "elaboracao"),
  abertura: (p)=> advanceTrack(p, "abertura", "Abertura de processo concluída"),
  remembramento: (p)=> advanceTrack(p, "remembramento", "Remembramento concluído"),
  trilhaAmbiental: (p)=> advanceTrack(p, "trilhaAmbiental", "Licença ambiental emitida — processo retornou ao DCA aguardando vistoria"),
};
function moveStep(projetoId, track, index, opts){
  const p = findProjeto(projetoId); if(!p) return;
  const steps = stepsOf(p, track);
  if(index<0 || index>=steps.length) return;
  // skipUndo: usado quando quem chamou (ex: toggleChecklistItem) já capturou
  // o "antes" da própria ação — evita que esse passo interno sobrescreva
  // aquele snapshot com um estado já parcialmente mutado.
  if(!(opts && opts.skipUndo)) captureUndo(p, `Mover ${TRACK_LABEL[track]} para "${steps[index]}"`);
  const concluida = index === steps.length-1;
  p[track+"Index"] = index;
  p[track+"Concluida"] = concluida;
  p[track+"Done"] = steps.map((_,i)=> i<=index); // mantém o checklist em sincronia com o seletor de etapa
  p.dataEntradaSetorAtual = new Date().toISOString();
  pushLog(p, `${state.currentUser} moveu ${TRACK_LABEL[track]} para "${steps[index]}"`);
  if(FASE_OF_TRACK[track]) setFase(p, FASE_OF_TRACK[track]);
  if(concluida) MOVE_STEP_ON_CONCLUIDA[track]?.(p);
  syncProjeto(p);
  save();
}

// Notas rápidas: anotações de uma linha, só do próprio usuário, opcionalmente
// ligadas a um projeto. Concluir não apaga: vai pro Diário (agrupado por dia) e,
// se houver projeto, registra no histórico dele.
function syncNota(n){

    .then(({error})=>{ if(error) reportSyncError("a nota", error); });
}
function projetoLabel(p){ return `${p.numeroProcesso || "sem protocolo"} · ${clienteNome(p)} · ${p.endereco||""}`; }
function addNota(texto, projetoTexto){
  texto = (texto||"").trim(); if(!texto) return;

function editNotaSave(){

  const n = state.notas.find(x=>x.id===e.id);
  const texto = (e.texto||"").trim();

function toggleNota(id){
  const n = state.notas.find(x=>x.id===id); if(!n) return;

  syncNota(n);
  save();
}
function deleteNota(id){

  save();
}
// "Hoje" / "Ontem" / DD/MM/AAAA
function rotuloDia(iso){
  const d = new Date(iso), h = new Date();
  const mesmoDia = (a,b)=> a.toDateString()===b.toDateString();
  if(mesmoDia(d,h)) return `Hoje · ${fmtDate(d).slice(0,5)}`;
  const o = new Date(h); o.setDate(h.getDate()-1);
  return mesmoDia(d,o) ? `Ontem · ${fmtDate(d).slice(0,5)}` : fmtDate(d);
}
const horaDe = iso => new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function notaProjetoChip(n){
  const p = n.projetoId ? findProjeto(n.projetoId) : null;
  if(p) return `<button class="n-proj-chip" data-action="nota-open-projeto" data-id="${p.id}" title="${esc(projetoLabel(p))}">${esc(p.numeroProcesso || clienteNome(p))}</button>`;
  return n.assunto ? `<span class="n-proj-chip" style="cursor:default;background:var(--info-bg);color:var(--info-ink)">${esc(n.assunto)}</span>` : "";
}
// Texto da nota, ou o campo de edição quando ela está sendo corrigida.
function notaTexto(n, feita){
  if(state.editNota && state.editNota.id===n.id){
    return `<span class="edit-row" style="flex:1"><input type="text" data-autofocus data-action="nota-edit-text" value="${esc(state.editNota.texto)}"><button class="ok" data-action="nota-edit-save">Salvar</button><button class="cancel" data-action="nota-edit-cancel">Cancelar</button></span>`;
  }
  return `<span class="n-txt ${feita?"feita":""}">${esc(n.texto)}${n.editada ? `<span class="editado">(editada)</span>` : ""}</span>`;
}
// Ordem manual das notas abertas: campo `ordem` dentro do próprio JSON da nota
// (não precisa mudar a tabela). Nota sem `ordem` (recém-criada) vem no topo.
function ordenarAbertas(lista){
  return [...lista].sort((a,b)=>{
    const oa = a.ordem, ob = b.ordem;
    if(oa==null && ob==null) return b.criada.localeCompare(a.criada);
    if(oa==null) return -1;
    if(ob==null) return 1;
    return oa-ob;
  });
}
const diaKey = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const dataCurta = iso => fmtDate(new Date(iso)).slice(0,5);
function diaOntemKey(){ const o = new Date(); o.setDate(o.getDate()-1); return diaKey(o); }
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
// Diário no estilo bullet journal: mini calendário do mês (pontinho nos dias
// com atividade) e, embaixo, o que foi anotado e concluído no dia escolhido.
// Abre em "ontem"; clicar em outro dia troca a lista.
function renderDiario(){
  const sel = state.diarioDia || diaOntemKey();
  const [sy,sm] = sel.split("-").map(Number);
  const mes = state.diarioMes || `${sy}-${String(sm).padStart(2,"0")}`;
  const [my,mm] = mes.split("-").map(Number);
  const criadas = {}, feitas = {};
  for(const n of state.notas){
    (criadas[diaKey(n.criada)] = criadas[diaKey(n.criada)] || []).push(n);
    if(n.feita && n.feitaEm) (feitas[diaKey(n.feitaEm)] = feitas[diaKey(n.feitaEm)] || []).push(n);
  }
  const primeiro = new Date(my, mm-1, 1), nDias = new Date(my, mm, 0).getDate();
  const hojeK = diaKey(new Date());
  let cel = "";
  for(let i=0;i<primeiro.getDay();i++) cel += `<span></span>`;
  for(let d=1; d<=nDias; d++){
    const k = `${my}-${String(mm).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const tem = (criadas[k]||[]).length + (feitas[k]||[]).length > 0;
    cel += `<button class="cal-dia ${k===sel?"sel":""} ${k===hojeK?"hoje":""} ${tem?"tem":""}" data-action="diario-dia" data-dia="${k}" title="${tem?"Tem registros neste dia":""}">${d}</button>`;
  }
  // Histórico do dia: uma lista só, em ordem de horário, somente leitura.
  // Concluída no dia = riscada; só anotada (ainda aberta, ou concluída em outro dia) = cinza.
  const vistos = new Map();
  for(const n of (feitas[sel]||[])) vistos.set(n.id, {n, hora:n.feitaEm, riscada:true});
  for(const n of (criadas[sel]||[])) if(!vistos.has(n.id)) vistos.set(n.id, {n, hora:n.criada, riscada:false});
  const itens = [...vistos.values()].sort((a,b)=>a.hora.localeCompare(b.hora));
  const linha = ({n, hora, riscada})=>`<div class="nota-row ${riscada?"":"nota-so-anotada"}">
      <span class="n-chk" style="cursor:default">${riscada?ICONS.sqCheck:ICONS.sq}</span>
      <span class="n-txt ${riscada?"feita":""}">${esc(n.texto)}${n.editada ? `<span class="editado">(editada)</span>` : ""}</span>${notaProjetoChip(n)}
      <span class="n-meta">${horaDe(hora)}</span>
    </div>`;
  const [dy,dm,dd] = sel.split("-").map(Number);
  const rotulo = rotuloDia(new Date(dy,dm-1,dd,12).toISOString());
  return `<div class="diario">
    <div class="cal">
      <div class="cal-head"><button class="icon-btn" data-action="diario-mes" data-delta="-1" aria-label="Mês anterior">‹</button><b>${MESES[mm-1]} ${my}</b><button class="icon-btn" data-action="diario-mes" data-delta="1" aria-label="Próximo mês">›</button></div>
      <div class="cal-grid">${["D","S","T","Q","Q","S","S"].map(x=>`<span class="cal-sem">${x}</span>`).join("")}${cel}</div>
    </div>
    <div class="diario-lista">
      <div class="diario-dia" style="margin-top:0">${rotulo}</div>
      ${itens.length===0 ? `<div style="font-size:12px;color:var(--ink-faint);padding:6px 2px">Nada anotado nem concluído neste dia.</div>` : itens.map(linha).join("")}
    </div>
  </div>`;
}

    <div class="section-title" style="margin-bottom:0">${ICONS.edit} Notas rápidas${abertas.length?` <span class="nav-badge">${abertas.length}</span>`:""}</div>
    <div class="nota-add">
      <input class="n-texto" placeholder="Anote em uma linha e aperte Enter..." data-action="nota-input" value="${esc(state.notaDraft)}">
      <input class="n-proj" list="notas-projetos" placeholder="Projeto ou assunto (opcional)" title="Escolha um projeto da lista ou escreva um assunto livre, ex: Escritório" data-action="nota-projeto-input" value="${esc(state.notaProjetoDraft)}">
      <datalist id="notas-projetos">${state.projetos.map(p=>`<option value="${esc(projetoLabel(p))}"></option>`).join("")}</datalist>

    </div>
    ${abertas.length===0 ? `<div style="font-size:12px;color:var(--ink-faint);padding:4px 2px">Nada pendente.</div>` : abertas.map(n=>{
      const editando = state.editNota && state.editNota.id===n.id;
      return `
      <div class="nota-row" ${editando?"":`draggable="true"`} data-drag="nota" data-id="${n.id}">
