        ${notaTexto(n)}${notaProjetoChip(n)}
        <span class="n-meta">${dataCurta(n.criada)} · ${horaDe(n.criada)}</span>
        ${editando ? "" : `<button class="edit-btn" data-action="nota-edit" data-id="${n.id}" title="Editar nota">✎</button>`}
        <button class="n-x" data-action="nota-delete" data-id="${n.id}" title="Apagar nota">✕</button>
      </div>`;}).join("")}
    <button class="hist-toggle ${state.diarioOpen?"open":""}" style="margin-top:10px" data-action="diario-toggle">${ICONS.history} Diário <span style="font-weight:400;color:var(--ink-faint)">(${nFeitas} concluída${nFeitas===1?"":"s"})</span><span class="chev">&#9654;</span></button>
    ${state.diarioOpen ? renderDiario() : ""}
  </div>`;
}
// "No radar": alguém da equipe pede que outra pessoa fique de olho num processo
// (prazo sensível, cliente pressionando...). Diferente de uma menção, não é uma
// tarefa que se resolve: fica até alguém tirar. Uma entrada por pessoa.
function radarDe(p, user){ return (p.radar||[]).find(r=>r.pessoa===user) || null; }
function addRadar(projetoId, pessoa, motivo){
  const p = findProjeto(projetoId); if(!p || !pessoa) return;
  captureUndo(p, "Colocar no radar");
  motivo = (motivo||"").trim();
  const entry = {pessoa, motivo, por: state.currentUser, data: fmtDate(new Date())};
  const idx = p.radar.findIndex(r=>r.pessoa===pessoa);
  if(idx>=0) p.radar[idx] = entry; else p.radar.push(entry); // pedir de novo atualiza o motivo
  pushLog(p, `${state.currentUser} colocou o projeto no radar de ${pessoa}${motivo?`: "${motivo}"`:""}`);
  syncProjeto(p);
  setState({radarOpen:false, radarPessoa:"", radarMotivo:""});
}
function removeRadar(projetoId, pessoa){
  const p = findProjeto(projetoId); if(!p) return;
  captureUndo(p, "Tirar do radar");
  p.radar = p.radar.filter(r=>r.pessoa!==pessoa);
  pushLog(p, `${state.currentUser} tirou o projeto do radar de ${pessoa}`);
  syncProjeto(p);
  save();
}
// Tudo que está no radar de `user`, em todos os projetos (mais recentes primeiro).
// Ordem escolhida arrastando (radar e mural de menções): lista de chaves por pessoa.
// Fica no navegador e também numa linha especial da tabela "notas" (só da própria
// pessoa), então vale em qualquer aparelho. Quem não tem posição vem no topo.
const ORDEM_KEY = "gestao-projetos-ordem";
function ordemSalva(tipo, user){
  try{ return (JSON.parse(localStorage.getItem(ORDEM_KEY)||"{}")[tipo+":"+user]) || []; }catch(e){ return []; }
}
function salvarOrdem(tipo, user, ids, sincronizar=true){
  if(sincronizar){
    sb.from("notas").upsert({id:tipo+"-ordem-"+user, autor:user, data:{tipo:tipo+"Ordem", ids}, updated_at:new Date().toISOString()})
      .then(({error})=>{ if(error) reportSyncError("a ordem dos cards", error); });
  }
  try{ const o = JSON.parse(localStorage.getItem(ORDEM_KEY)||"{}"); o[tipo+":"+user] = ids; localStorage.setItem(ORDEM_KEY, JSON.stringify(o)); }catch(e){}
}
function aplicarOrdem(items, chave, tipo, user){
  const ord = ordemSalva(tipo, user);
  const pos = it=> ord.indexOf(chave(it));
  return items.map((it,i)=>({it,i})).sort((a,b)=> (pos(a.it)-pos(b.it)) || (a.i-b.i)).map(x=>x.it);
}
const chaveRadar = it=> it.projeto.id;
const chaveMencao = it=> it.projeto.id+":"+it.comment.id;
function collectRadar(user){
  const items = [];
  for(const p of state.projetos){ const r = radarDe(p, user); if(r) items.push({projeto:p, radar:r}); }
  items.sort((a,b)=> parseBRDate(b.radar.data) - parseBRDate(a.radar.data));
  return aplicarOrdem(items, chaveRadar, "radar", user);
}
// Arrastar e soltar: move `deId` para antes (ou depois) de `paraId`.
function moverNoArray(ids, deId, paraId, depois){
  if(deId===paraId || ids.indexOf(deId)<0 || ids.indexOf(paraId)<0) return ids;
  const out = ids.filter(x=>x!==deId);
  out.splice(out.indexOf(paraId) + (depois?1:0), 0, deId);
  return out;
}
function reordenarNotas(deId, paraId, depois){
  const ids = moverNoArray(ordenarAbertas(state.notas.filter(n=>!n.feita)).map(n=>n.id), deId, paraId, depois);
  ids.forEach((id,i)=>{ const n = state.notas.find(x=>x.id===id); if(n && n.ordem!==i){ n.ordem = i; syncNota(n); } });
  render();
}
function reordenarCards(tipo, deId, paraId, depois){
  const chave = tipo==="radar" ? chaveRadar : chaveMencao;
  const lista = tipo==="radar" ? collectRadar(state.currentUser) : collectPendingMentions(state.currentUser);
  salvarOrdem(tipo, state.currentUser, moverNoArray(lista.map(chave), deId, paraId, depois));
  render();
}
function soltar(kind, deId, paraId, depois){
  if(kind==="nota") reordenarNotas(deId, paraId, depois); else reordenarCards(kind, deId, paraId, depois);
}
// Marcação de "onde vai cair": uma barra no espaço entre os cards (antes/depois do
// alvo), não um contorno no card inteiro. Cards lado a lado: metade esquerda/direita;
// linhas empilhadas: metade de cima/de baixo.
function depoisDoAlvo(el, x, y){
  const r = el.getBoundingClientRect();
  return el.classList.contains("postit") ? x > r.left + r.width/2 : y > r.top + r.height/2;
}
function marcarAlvo(el, x, y){
  limparAlvo();
  if(!el) return null;
  const depois = depoisDoAlvo(el, x, y);
  el.classList.add(depois ? "solta-depois" : "solta-antes");
  return depois;
}
function limparAlvo(){ document.querySelectorAll(".solta-antes,.solta-depois").forEach(x=>x.classList.remove("solta-antes","solta-depois")); }
let arrastando = null;
document.addEventListener("dragstart", (e)=>{
  const el = e.target.closest && e.target.closest("[data-drag]"); if(!el) return;
  arrastando = {kind:el.dataset.drag, id:el.dataset.id};
  e.dataTransfer.effectAllowed = "move"; try{ e.dataTransfer.setData("text/plain", el.dataset.id); }catch(_){}
  el.classList.add("arrastando");
});
document.addEventListener("dragover", (e)=>{
  if(!arrastando) return;
  const el = e.target.closest && e.target.closest("[data-drag]");
  if(el && el.dataset.drag===arrastando.kind){ e.preventDefault(); marcarAlvo(el.dataset.id!==arrastando.id ? el : null, e.clientX, e.clientY); }
});
document.addEventListener("drop", (e)=>{
  const el = arrastando && e.target.closest && e.target.closest("[data-drag]");
  if(!el || el.dataset.drag!==arrastando.kind) return;
  e.preventDefault();
  const a = arrastando; arrastando = null;
  soltar(a.kind, a.id, el.dataset.id, depoisDoAlvo(el, e.clientX, e.clientY));
});
// Toque (celular): o arrastar do navegador não funciona com o dedo, então a alça
// ⠿ usa eventos de ponteiro. A alça tem touch-action:none para não rolar a tela.
let toque = null;
const alvoDoToque = (x,y)=>{ const el = document.elementFromPoint(x,y); const t = el && el.closest("[data-drag]"); return t && toque && t.dataset.drag===toque.kind && t.dataset.id!==toque.id ? t : null; };
document.addEventListener("pointerdown", (e)=>{
  if(e.pointerType==="mouse") return;
  const h = e.target.closest && e.target.closest(".drag-h"); const el = h && h.closest("[data-drag]"); if(!el) return;
  toque = {kind:el.dataset.drag, id:el.dataset.id, alvo:null, depois:false};
  el.classList.add("arrastando"); try{ h.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener("pointermove", (e)=>{
  if(!toque) return;
  const t = alvoDoToque(e.clientX, e.clientY);
  toque.alvo = t; toque.depois = marcarAlvo(t, e.clientX, e.clientY);
});
const fimDoToque = (e)=>{
  if(!toque) return;
  const t = toque; toque = null;
  document.querySelectorAll(".arrastando").forEach(x=>x.classList.remove("arrastando")); limparAlvo();
  if(e.type==="pointerup" && t.alvo) soltar(t.kind, t.id, t.alvo.dataset.id, t.depois);
};
document.addEventListener("pointerup", fimDoToque);
document.addEventListener("pointercancel", fimDoToque);
document.addEventListener("dragend", ()=>{ arrastando = null; document.querySelectorAll(".arrastando").forEach(x=>x.classList.remove("arrastando")); limparAlvo(); });
// Pendência = comentário que exige resolução (qualquer tipo que não seja
// "Nota", ou uma nota que marca alguém) e ainda não foi resolvido. É guardado
// em c.observacao na hora de criar, pra não mudar o formato dos dados.
function pendentesAbertos(p){
  return p.comments.filter(c=>c.observacao && !c.resolvida);
}
// Pendências que mencionam `user` e ainda não foram marcadas como resolvidas.
function pendingMentions(p, user){
  return p.comments.filter(c=>c.observacao && c.mencionado===user && !c.resolvida);
}
// Comentário só guarda a data já formatada (DD/MM/AAAA, sem hora) — não tem
// timestamp bruto salvo à parte. Pra ordenar "mais recente primeiro" no
// mural, reconstrói um valor comparável a partir dessa string.
function parseBRDate(str){
  if(!str) return 0;
  const [d,m,y] = str.split("/").map(Number);
  return new Date(y, (m||1)-1, d||1).getTime();
}
// Agrega, de TODOS os projetos (não só os da lista "mine" por
// responsabilidade), os comentários-observação pendentes que mencionam
// `user` — é o que alimenta o Mural de menções em "Minhas tarefas". Varre
// state.projetos uma vez e cada array de comments uma vez: O(nº total de
// comentários do painel), a mesma conta que enrich() já faz pra popular os
// badges de observação em toda lista — nada de custo adicional relevante
// mesmo com centenas de projetos.
function collectPendingMentions(user){
  const items = [];
  for(const p of state.projetos){
    for(const c of pendingMentions(p, user)) items.push({projeto:p, comment:c});
  }
  items.sort((a,b)=> parseBRDate(b.comment.data) - parseBRDate(a.comment.data));
  return aplicarOrdem(items, chaveMencao, "mencoes", user);
}
function toggleCheck(projetoId, field){
  const p = findProjeto(projetoId); if(!p) return;
  const cur = p[field];
  const nowChecked = !cur.checked;
  const label = field==="taxaEnviada" ? "Taxa enviada ao cliente" : "Comprovante anexado";
  captureUndo(p, `${nowChecked?"Marcar":"Desmarcar"} "${label}"`);
  p[field] = { checked: nowChecked, data: nowChecked ? fmtDate(new Date()) : null, autor: nowChecked ? state.currentUser : null };
  pushLog(p, `${state.currentUser} ${nowChecked?"marcou":"desmarcou"} '${label}'`);
  syncProjeto(p);
  save();
}

// Sub-checklist de taxa (boleto enviado / comprovante
// anexado) da passagem aberta atual em trilhaPrincipal/trilhaHabitese —
// equivalente ao toggleCheck acima, mas por passagem em vez de por projeto,
// já que essas trilhas são reentrantes (mais de uma passagem pode ter fee).
function toggleLogFee(projetoId, track, subfield){
  const p = findProjeto(projetoId); if(!p) return;
  const open = openEntryOf(p[track+"Log"]||[]); if(!open || !open.fee) return;
  const cur = open.fee[subfield]; if(!cur) return;
  const nowChecked = !cur.checked;
  const labels = {boleto:"Boleto enviado", comprovante:"Comprovante anexado"};
  captureUndo(p, `${nowChecked?"Marcar":"Desmarcar"} "${labels[subfield]}"`);
  open.fee[subfield] = { checked: nowChecked, data: nowChecked ? fmtDate(new Date()) : null, autor: nowChecked ? state.currentUser : null };
  pushLog(p, `${state.currentUser} ${nowChecked?"marcou":"desmarcou"} '${labels[subfield]}' (${open.setor} — ${open.motivo})`);
  syncProjeto(p);
  save();
}

// Checklist de Comercial/Elaboração/Abertura: cada item pode ser marcado ou
// desmarcado independente da ordem dos outros. Só quando TODOS os itens da
// trilha estiverem marcados ela avança automaticamente pra próxima fase
// (reaproveitando moveStep no último índice, que dispara os mesmos gatilhos
// de conclusão de sempre). O prazo/semáforo da trilha continua acompanhando o
// primeiro item ainda pendente — é o que está "travando" o avanço.
function toggleChecklistItem(projetoId, track, itemIndex){
  const p = findProjeto(projetoId); if(!p) return;
  const steps = stepsOf(p, track);
  const done = checklistDone(p, track).slice();
  const firstPendingBefore = done.findIndex(d=>!d);
  const willCheck = !done[itemIndex];
  captureUndo(p, `${willCheck?"Marcar":"Desmarcar"} "${steps[itemIndex]}"`);
  done[itemIndex] = willCheck;
  p[track+"Done"] = done;
  pushLog(p, `${state.currentUser} ${done[itemIndex]?"marcou":"desmarcou"} "${steps[itemIndex]}"`);
  if(done.every(Boolean)){ moveStep(projetoId, track, steps.length-1, {skipUndo:true}); return; }
  const firstPendingAfter = done.findIndex(d=>!d);
  p[track+"Index"] = firstPendingAfter;
  p[track+"Concluida"] = false;
  if(firstPendingAfter !== firstPendingBefore) p.dataEntradaSetorAtual = new Date().toISOString();
  syncProjeto(p);
  save();
}

// Comentário com tipo (Nota, Modificação, Exigência, Correção) e, opcionalmente,
// alguém marcado. Tudo que não é Nota — ou que marca alguém — vira pendência:
// fica aberto até ser resolvido e, se marcar alguém, o projeto aparece em
// "Minhas tarefas" dessa pessoa mesmo que ela não seja a responsável.
// "cliente" quando o valor não é um solicitante válido
function solicitanteValido(v){ return SOLICITANTE_LABEL[v] ? v : "cliente"; }
function addComment(projetoId, {texto, tipo, solicitante, rev, mencionado}){
  const p = findProjeto(projetoId); if(!p || !texto.trim()) return;
  captureUndo(p, "Adicionar comentário");
  tipo = COMMENT_TIPO[tipo] ? tipo : "nota";
  const mencionadoNome = mencionado || null;
  const pendencia = tipo!=="nota" || !!mencionadoNome;
  p.comments.unshift({id:uid(), autor: state.currentUser, texto: texto.trim(), data: fmtDate(new Date()),
    tipo, solicitante: tipo==="modificacao" ? (SOLICITANTE_LABEL[solicitante] ? solicitante : "cliente") : null, rev: rev || null, observacao: pendencia, mencionado: mencionadoNome, resolvida:false, dataResolucao:null});
  if(pendencia) pushLog(p, `${state.currentUser} registrou ${COMMENT_TIPO[tipo].label.toLowerCase()}${tipo==="modificacao" ? ` (pedido: ${SOLICITANTE_LABEL[solicitanteValido(solicitante)].toLowerCase()})` : ""}${mencionadoNome?` para ${mencionadoNome}`:""}: "${texto.trim()}"`);
  syncProjeto(p);
  // a revisão escolhida fica selecionada (vários comentários seguidos na mesma REV)
  setState({commentDraft:"", commentTipo:"nota", commentSolicitante:"cliente", commentMencionado:""});
}
function toggleCommentResolved(projetoId, commentId){
  const p = findProjeto(projetoId); if(!p) return;
  const c = p.comments.find(x=>x.id===commentId); if(!c) return;
  captureUndo(p, `${c.resolvida?"Reabrir":"Resolver"} comentário`);
  c.resolvida = !c.resolvida;
  c.dataResolucao = c.resolvida ? fmtDate(new Date()) : null;
  pushLog(p, `${state.currentUser} marcou ${COMMENT_TIPO[c.tipo].label.toLowerCase()} como ${c.resolvida?"resolvido":"pendente"}`);
  syncProjeto(p);
  save();
}

function patchProjeto(projetoId, patch){
  const p = findProjeto(projetoId); if(!p) return;
  captureUndo(p, "Atualizar dados do projeto");
  if("responsavel" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} alterou o responsável para ${patch.responsavel||"—"}`); }
  if("statusBloqueio" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} alterou o status para "${patch.statusBloqueio}"`); }
  if("numeroProcesso" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} registrou o nº de protocolo ${patch.numeroProcesso||"—"}`); }
  if("numeroIptu" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} registrou o nº do IPTU ${patch.numeroIptu||"—"}`); }
  if("empresaId" in patch && patch.empresaId){ Object.assign(p,patch); pushLog(p, `${state.currentUser} alterou o cliente para ${empresaNomeById(patch.empresaId)}`); }
  if("endereco" in patch && patch.endereco){ Object.assign(p,patch); pushLog(p, `${state.currentUser} alterou o endereço`); }
  if("loteQuadra" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} alterou o lote/quadra`); }
  if("tipoServico" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} alterou o tipo de serviço para ${patch.tipoServico}`); }
  if("infoBasicas" in patch){ Object.assign(p,patch); pushLog(p, `${state.currentUser} atualizou as informações básicas do projeto`); }
  syncProjeto(p);
  save();
}

function createProjeto(data){
  const p = {
    id: uid(), empresaId:data.empresaId, endereco:data.endereco, loteQuadra:data.loteQuadra||null,
    tipoServico:data.tipoServico, dataContrato:new Date().toISOString(), numeroProcesso:null, numeroIptu:null,
    infoBasicas:data.infoBasicas||null,
    fase:"contrato", faseDesde:new Date().toISOString(), responsavel:null, statusBloqueio:"Ok", dataEntradaSetorAtual:new Date().toISOString(),
    comercialIndex:-1, comercialConcluida:false, elaboracaoIndex:-1, elaboracaoConcluida:false, aberturaIndex:-1, aberturaConcluida:false,
    remembramentoIndex:-1, remembramentoConcluida:false,
    trilhaPrincipalLog:[], trilhaHabiteseLog:[],
    trilhaAmbientalIndex:-1, trilhaAmbientalConcluida:false,
    taxaEnviada:{checked:false,data:null,autor:null}, comprovante:{checked:false,data:null,autor:null},
    finalizado:false, comments:[], log:[{id:uid(), texto:`${state.currentUser} criou o projeto`, data:fmtDateTime(new Date())}],
  };
  // se a trilha inicial padrão (Comercial) estiver desligada pra esse tipo de
  // serviço, o projeto já entra direto na primeira trilha ligada da cadeia.
  const first = firstEnabledTrack(p);
  if(first && first!=="comercial"){
    setFase(p, FASE_OF_TRACK[first]);
    if(LOG_TRACKS.includes(first)){
      const c = catalogOf(p, first)[0];
      if(c) openPassagem(p, first, c.setor, c.motivo, {auto:true, silent:true});
    } else {
      p[first+"Index"] = 0;
    }
  }
  state.projetos.push(p);
  syncProjeto(p);
  // leva pra lista onde o projeto novo aparece (ele nasce sem responsável, então
  // não cairia em "Minhas tarefas" — parecia que nada tinha sido criado) e
  // limpa os filtros pra ele não ficar escondido por um filtro antigo
  setState({showNovo:false, empresaPicker: defaultEmpresaPicker(), novoError:null, filters: defaultFilters(), mobileNavOpen:false, ...listLocationOfFase(p.fase)});
}
// Exclui o projeto pra equipe inteira (some do banco; os outros navegadores
// recebem o aviso em tempo real). Só roda depois da confirmação no modal.
function deleteProjeto(id){
  const p = findProjeto(id); if(!p) return;
  state.projetos = state.projetos.filter(x=>x.id!==id);
  if(lastAction && lastAction.projetoId===id) lastAction = null; // não há mais o que desfazer
  sb.from("projetos").delete().eq("id", id).select("id").then(({data, error})=>{
    if(error) reportSyncError("a exclusão do projeto", error);
    else if(!data || data.length===0) reportSyncError("a exclusão do projeto", {message:"o servidor não confirmou a exclusão — talvez já tenha sido excluído por outra pessoa"});
  });
  setState(closeModalState());
}
// Em qual view (e sub-aba) um projeto naquela fase aparece nas listas
function listLocationOfFase(fase){
  if(fase==="contrato") return {view:"comercial"};
  if(fase==="elaboracao" || fase==="abertura_processo") return {view:"interno", internoTab:fase};
  if(fase==="remembramento") return {view:"remembramento"};
  if(fase==="licenca_obra" || fase==="licenca_ambiental" || fase==="habitese") return {view:"trilhas", trilhaTab:fase};
  return {view:"finalizados"};
}

/* ===================== derivação (visão calculada) ===================== */
function enrich(p){
  const now = new Date();
  const base = p.dataAberturaProcesso || p.dataContrato;
  const diasTotal = diasEntre(new Date(base), now);
  const tracks = {};
  for(const t of TRACK_KEYS) tracks[t] = LOG_TRACKS.includes(t) ? logStatus(p, t) : trilhaStatus(p, t, p[t+"Index"], p[t+"Concluida"]);
  const activeTrack = TRACK_OF_FASE[p.fase] || "comercial";
  let diasSetor, prazoSetor, hasFee, feeOpen = null;
  if(LOG_TRACKS.includes(activeTrack)){
    const open = tracks[activeTrack].open;
    diasSetor = open ? diasEntre(new Date(open.dataEntrada), now) : 0;
    prazoSetor = p.fase==="finalizado" ? 0 : (open ? (open.diasEsperado||0) : 0);
    hasFee = !!(open && open.fee);
    feeOpen = open;
  } else {
    diasSetor = diasEntre(new Date(p.dataEntradaSetorAtual), now);
    const activeIndex = tracks[activeTrack].currentIndex;
    prazoSetor = p.fase==="finalizado" ? 0 : prazoParaEtapa(p, activeTrack, activeIndex);
    hasFee = hasFeeStep(p, activeTrack, activeIndex);
  }
  const semaforo = p.fase==="finalizado" ? null : calcSemaforo(diasSetor, prazoSetor);
  const w = wf(p);
  const showAmbientalBadge = w.hasAmbiental && (p.trilhaAmbientalIndex>=0 || p.trilhaAmbientalConcluida);
  const showHabiteseBadge = w.hasHabitese && (p.trilhaHabiteseLog||[]).length>0;
  return {...p, diasTotal, diasSetor, prazoSetor, semaforo, activeTrack, setorAtual:tracks[activeTrack].setorLabel,
    hasFee, feeOpen, showAmbientalBadge, showHabiteseBadge, tracks};
}

// Conteúdo da view atualmente selecionada (uma das seis listas ou a aba de
// configurações) — cada view recebe sua base (antes dos filtros combináveis)
// e sua lista já filtrada, pra montar a barra de filtro + a lista/tabela.
// Notas rápidas, radar e menções ficam recolhidos em três botões no topo de
// Minhas tarefas (o contador mostra o que está pendente); clicar abre o bloco.
function renderMineBlocos(){
  const open = state.mineOpen || {};
  const nNotas = state.notas.filter(n=>!n.feita).length;
  const nRadar = collectRadar(state.currentUser).length;
  const nMenc = collectPendingMentions(state.currentUser).length;
  const botoes = [["notas","Notas rápidas",nNotas],["radar","No seu radar",nRadar],["mencoes","Mural de menções",nMenc]]
    .filter(([k,,n])=> k!=="radar" || n>0 || open.radar) // sem nada no radar, o botão nem aparece
    .map(([k,label,n])=>`<button class="mk-sb ${open[k]?"open":""}" data-action="mine-block" data-key="${k}" aria-expanded="${!!open[k]}">${label}${n?` <b>${n}</b>`:""}</button>`).join("");
  return `<div class="mk-strip">${botoes}</div>`
    + (open.notas ? renderNotasRapidas() : "")
    + (open.radar ? renderRadarMural() : "")
    + (open.mencoes ? renderMuralMencoes() : "");
}
function renderMainContent(view, lists){
  const {comercialBase, comercialList, internoBase, internoList, internoDef, trilhasBase, trilhasList, trilhasFaseAtual, remembramentoBase, remembramentoList, mineBase, mine, stalledBase, stalled, finalizadosBase, finalizados, semFiltro} = lists;
  if(view==="comercial") return renderFilterBar(comercialBase, comercialList, true) + renderChecklistList(comercialList, "comercial", semFiltro(comercialBase, "Nenhum projeto em Comercial no momento."));
  if(view==="interno") return renderFilterBar(internoBase, internoList, true) + renderChecklistList(internoList, internoDef.track, semFiltro(internoBase, `Nenhum projeto em ${internoDef.label} no momento.`));
  if(view==="trilhas") return renderFilterBar(trilhasBase, trilhasList, true) + renderList(trilhasList, semFiltro(trilhasBase, `Nenhum projeto em ${TRILHA_SUBTABS.find(t=>t.key===trilhasFaseAtual).label} no momento.`), {prefeitura:true});
  if(view==="remembramento") return renderFilterBar(remembramentoBase, remembramentoList, true) + renderChecklistList(remembramentoList, "remembramento", semFiltro(remembramentoBase, "Nenhum projeto em Remembramento no momento."), {prefeitura:true});
  if(view==="mine") return renderMineBlocos() + renderFilterBar(mineBase, mine, true) + renderList(mine, semFiltro(mineBase, "Nenhuma tarefa atribuída a você no momento."));
  if(view==="stalled") return renderFilterBar(stalledBase, stalled, true) + renderList(stalled, semFiltro(stalledBase, "Nenhum projeto parado ou atrasado. 🎉"));
  if(view==="finalizados") return renderFilterBar(finalizadosBase, finalizados, false) + renderList(finalizados, semFiltro(finalizadosBase, "Nenhum projeto finalizado ainda."));
  if(view==="config"){
    // Configurações tem formulários densos (várias colunas por linha) que
    // não fazem sentido reformular pra tela de celular — nesse tamanho de
    // tela, orienta a pessoa a usar um computador em vez de tentar encaixar.
    if(window.innerWidth <= MOBILE_BREAKPOINT){
      return `<div class="empty-state" style="margin-top:16px">Configurações está disponível só no computador — a tela é densa demais pro celular. Acesse o painel num computador pra mexer nas trilhas e tipos de serviço.</div>`;
    }
    return renderConfig();
  }
  return "";
}
// Recorta os projetos enriquecidos nas bases de cada view de lista (o que a
// própria view já filtra por padrão, ex: fase="contrato" em Comercial) e
// aplica os filtros combináveis da barra em cima de cada uma — nunca no lugar
// delas.
//
// Todas as listas saem na ordem escolhida em state.sortBy (padrão: momento em
// que o projeto entrou na fase atual, do mais recente pro mais antigo). Os
// filtros abaixo preservam a ordem.
// "DD/MM/AA - HH:MM" (formato do registro de ações) -> timestamp
function parseLogDate(str){
  const m = /^(\d{2})\/(\d{2})\/(\d{2}) - (\d{2}):(\d{2})/.exec(str||"");
  return m ? new Date(2000+Number(m[3]), Number(m[2])-1, Number(m[1]), Number(m[4]), Number(m[5])).getTime() : 0;
}
const tsFaseDesde = p => Date.parse(p.faseDesde || p.dataEntradaSetorAtual || p.dataContrato) || 0;
// Projetos antigos ainda não têm updatedAt (só passa a existir na próxima
// edição): usa a data da ação mais recente do registro, ou a entrada na fase.
const tsModificacao = p => Date.parse(p.updatedAt) || parseLogDate((p.log[0]||{}).data) || tsFaseDesde(p);
const SORTERS = {
  fase: (a,b)=> tsFaseDesde(b) - tsFaseDesde(a),
  modificacao: (a,b)=> tsModificacao(b) - tsModificacao(a),
  adicao: (a,b)=> (Date.parse(b.dataContrato)||0) - (Date.parse(a.dataContrato)||0),
  alfa: (a,b)=> clienteNome(a).localeCompare(clienteNome(b), "pt-BR", {sensitivity:"base"}) || (a.endereco||"").localeCompare(b.endereco||"", "pt-BR", {sensitivity:"base"}),
};
function buildViewLists(enrichedIn){
  const enriched = [...enrichedIn].sort(SORTERS[state.sortBy] || SORTERS.fase);
  const stalledBase = enriched.filter(p=>p.semaforo==="red"||p.semaforo==="yellow");
  // "Minhas tarefas" mostra tanto os projetos sob sua responsabilidade quanto
  // qualquer projeto onde você foi mencionado numa observação ainda não
  // resolvida — mesmo que a responsabilidade seja de outra pessoa.
  const mineBase = enriched.filter(p=>p.responsavel===state.currentUser || pendingMentions(p, state.currentUser).length>0 || radarDe(p, state.currentUser));
  const finalizadosBase = enriched.filter(p=>p.fase==="finalizado");
  const internoDef = INTERNO_SUBTABS.find(t=>t.key===(state.internoTab||"elaboracao")) || INTERNO_SUBTABS[0];
  const comercialBase = enriched.filter(p=>p.fase==="contrato");
  const remembramentoBase = enriched.filter(p=>p.fase==="remembramento");
  const internoBase = enriched.filter(p=>p.fase===internoDef.key);
  const trilhasFaseAtual = state.trilhaTab||"licenca_obra";
  const trilhasBase = enriched.filter(p=>p.fase===trilhasFaseAtual);
  const semFiltro = (base, msg) => base.length===0 ? msg : "Nenhum projeto encontrado com esses filtros.";
  return {
    internoDef, trilhasFaseAtual, semFiltro,
    comercialBase, comercialList: applyFilters(comercialBase),
    remembramentoBase, remembramentoList: applyFilters(remembramentoBase),
    internoBase, internoList: applyFilters(internoBase),
    trilhasBase, trilhasList: applyFilters(trilhasBase),
    mineBase, mine: applyFilters(mineBase),
    stalledBase, stalled: applyFilters(stalledBase),
    finalizadosBase, finalizados: applyFilters(finalizadosBase),
  };
}
function renderApp(){
  const enriched = state.projetos.map(enrich);
  const lists = buildViewLists(enriched);
  const viewTitle = {comercial:"Comercial", interno:"Processos internos", trilhas:"Trilhas da prefeitura", remembramento:"Remembramento", mine:"Minhas tarefas", stalled:"Parados / atrasados", finalizados:"Finalizados", config:"Configurações"}[state.view];
  // quantos projetos há em cada fase (os sub-itens do menu têm a mesma chave da fase)
  const faseCounts = {};
  for(const p of state.projetos) faseCounts[p.fase] = (faseCounts[p.fase]||0) + 1;
  // sub-página ativa dos grupos do menu (mostrada ao lado do título)
  const subTabs = {interno:[INTERNO_SUBTABS, state.internoTab||"elaboracao"], trilhas:[TRILHA_SUBTABS, state.trilhaTab||"licenca_obra"]}[state.view];
  const subTitle = subTabs ? (subTabs[0].find(t=>t.key===subTabs[1]) || {}).label : "";
  return `
    ${renderSidebar(lists.stalledBase.length, faseCounts)}
    ${state.mobileNavOpen ? `<div class="sidebar-backdrop" data-action="mobile-nav-close"></div>` : ""}
    <div class="main">
      ${state.syncError ? `<div class="sync-banner"><span>${esc(state.syncError)}</span><button data-action="sync-error-dismiss">Fechar</button></div>` : ""}
      <div class="topbar">
        <button class="mobile-menu-btn" data-action="mobile-nav-toggle" title="Menu">${ICONS.grid}</button>
        <h2>${viewTitle}${subTitle ? ` <span style="color:var(--ink-faint);font-weight:400">/ ${esc(subTitle)}</span>` : ""}</h2>
        ${renderUndoButton()}
      </div>
      <div class="search-top">${renderSearchBox("search-input-top")}</div>
      <div class="content">
        ${renderMainContent(state.view, lists)}
      </div>
    </div>
    ${window.innerWidth <= MOBILE_BREAKPOINT ? renderBarraInferior() : ""}
    ${state.openId ? renderModal(enriched.find(p=>p.id===state.openId)) : ""}
    ${state.showNovo ? renderNovoModal() : ""}
  `;
}
// Barra inferior do celular: atalhos para Tarefas, novo projeto, Trilhas e o menu.
function renderBarraInferior(){
  const on = k=> state.view===k ? "on" : "";
  return `<div class="mk-bnav">
    <button data-action="view" data-view="mine" class="${on("mine")}">${ICONS.list}Tarefas</button>
    <button data-action="novo" aria-label="Novo projeto"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>+ Projeto</button>
    <button data-action="nav-sub" data-view="trilhas" data-tab="${state.trilhaTab||"licenca_obra"}" class="${on("trilhas")}">${ICONS.landmark}Trilhas</button>
    <button data-action="mobile-nav-toggle">${ICONS.grid}Mais</button>
  </div>`;
}
// Botão de desfazer, ao lado do título da tela — só o ícone, sempre visível.
// Fica desabilitado quando não há nenhuma ação recente pra desfazer (ver
// captureUndo); assim que uma ação acontece, vira clicável, com o que será
// desfeito aparecendo como dica ao passar o mouse.
function renderUndoButton(){
  const hasAction = !!lastAction;
  return `<button class="icon-btn undo-btn" data-action="undo-last" ${hasAction?"":"disabled"} title="${hasAction ? "Desfazer: "+esc(lastAction.label) : "Nada para desfazer"}">${ICONS.undo}</button>`;
}

// Busca rápida global: campo fixo no topo da sidebar, funciona em qualquer
// view — não navega, só abre um dropdown flutuante com os resultados.
function renderSearchBox(id){
  id = id || "search-input";
  const aqui = (state.searchWhere||"search-input")===id; // só a barra em uso mostra os resultados
  const q = state.searchQuery || "";
  const results = state.searchOpen && aqui ? searchProjetos(q) : [];
  const empresaMatch = state.searchOpen && aqui ? topEmpresaMatch(q) : null;
  return `<div class="search-box">
    <input id="${id}" class="search-input" type="text" placeholder="Buscar cliente, endereço, processo..." autocomplete="off" data-action="search-input" value="${esc(q)}">
    ${state.searchOpen && aqui ? `<div class="search-dropdown">
      ${empresaMatch ? `<div class="search-result search-result-empresa" data-action="search-empresa-open" data-id="${empresaMatch.id}">
        <div class="search-result-title">🏢 ${esc(empresaMatch.nome)}</div>
        <div class="search-result-meta">Ver todos os processos desta empresa</div>
      </div>` : ""}
      ${results.length===0 && !empresaMatch ? `<div class="search-empty">Nenhum projeto encontrado.</div>` : `
        ${results.slice(0,SEARCH_RESULT_LIMIT).map(p=>`
          <div class="search-result" data-action="search-result-open" data-id="${p.id}">
            <div class="search-result-title">${esc(clienteNome(p))}</div>
            <div class="search-result-meta">${esc(p.endereco||p.loteQuadra||"—")}${p.numeroProcesso?` · Nº ${esc(p.numeroProcesso)}`:""} · ${esc(MATRIZ_LABEL[p.fase]||p.fase)}</div>
          </div>
        `).join("")}
        ${results.length>SEARCH_RESULT_LIMIT ? `<div class="search-more">+${results.length-SEARCH_RESULT_LIMIT} resultado${results.length-SEARCH_RESULT_LIMIT===1?"":"s"}</div>` : ""}
      `}
    </div>` : ""}
  </div>`;
}

// Componente de autocomplete+cadastro de empresa — reaproveitado tanto no
// formulário "Novo projeto" quanto na edição do cabeçalho de um projeto
// existente. Estado vive em state.empresaPicker (só um de cada vez é
// mostrado na tela, então um único slot de estado é suficiente).
function renderEmpresaPicker(){
  const pk = state.empresaPicker || defaultEmpresaPicker();
  const query = pk.query || "";
  const showDropdown = query.trim().length>0 && !pk.selectedId;
  const exact = query.trim() ? findEmpresaByNome(state.empresas, query) : null;
  const matches = showDropdown ? searchEmpresas(state.empresas, query, 6) : [];
  const similar = (showDropdown && !exact) ? empresaSimilar(state.empresas, query) : null;
  return `<div class="empresa-picker">
    <input id="empresa-picker-input" type="text" autocomplete="off" placeholder="Buscar ou cadastrar empresa..." data-action="empresa-picker-input" value="${esc(query)}" style="width:100%;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:#fff">
    ${showDropdown ? `<div class="search-dropdown">
      ${matches.length>0 ? matches.map(e=>`<div class="search-result" data-action="empresa-picker-select" data-id="${e.id}" data-nome="${esc(e.nome)}"><div class="search-result-title">${esc(e.nome)}</div></div>`).join("") : ""}
      ${!exact ? (similar ? `
        <div class="empresa-warning">
          <div>Já existe uma empresa parecida: <b>${esc(similar.nome)}</b>. Usar essa em vez de cadastrar uma nova?</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn-secondary" style="width:auto" data-action="empresa-picker-select" data-id="${similar.id}" data-nome="${esc(similar.nome)}">Usar "${esc(similar.nome)}"</button>
            <button class="btn-secondary" style="width:auto" data-action="empresa-picker-create">Cadastrar mesmo assim</button>
          </div>
        </div>
      ` : `<div class="search-result" data-action="empresa-picker-create"><div class="search-result-title">+ Cadastrar nova empresa: "${esc(query.trim())}"</div></div>`) : ""}
    </div>` : ""}
  </div>`;
}

// Grupo expansivo do menu lateral: o título abre/fecha e as sub-páginas ficam
// visíveis logo abaixo, a um clique (antes ficavam em abas dentro da página).
// Contador discreto de projetos (sem filtros) em cada sub-página do menu.
function navCount(n){ return `<span class="nav-count${n ? "" : " zero"}">${n||0}</span>`; }
function navGroup(key, icon, label, subtabs, activeTab, faseCounts){
  const open = state.navOpen[key] !== false;
  const inGroup = state.view===key;
  return `<button class="nav-item nav-group ${inGroup?"group-active":""}" data-action="nav-toggle" data-group="${key}" aria-expanded="${open}">
    ${icon}<span>${label}</span><span class="nav-chev ${open?"open":""}">${ICONS.chev}</span>
  </button>
  ${open ? `<div class="nav-sub">${subtabs.map(t=>`<button class="nav-sub-item ${inGroup && activeTab===t.key?"active":""}" data-action="nav-sub" data-view="${key}" data-tab="${t.key}"><span>${t.label}</span>${navCount(faseCounts[t.key])}</button>`).join("")}</div>` : ""}`;
}
function navItem(key, icon, label, badge){
  return `<button class="nav-item ${state.view===key?"active":""}" data-action="view" data-view="${key}">
    ${icon}<span>${label}</span>${badge ? `<span class="nav-badge">${badge}</span>` : ""}
  </button>`;
}

// Barra de filtros combináveis, mostrada acima de cada view de lista
// (comercial/interno/trilhas/mine/stalled/finalizados). `showSemaforo` fica
// falso em Finalizados, onde o semáforo não existe (fase="finalizado" nunca
// tem prazo/atraso calculado).
// Etiqueta legível de cada filtro ativo (as etiquetas ficam na barra, com ✕).
function filterChipLabel(k, f){
  return {
    responsavel: `Responsável: ${f.responsavel}`,
    semaforo: `Semáforo: ${(SEMAFORO_FILTER_OPTS.find(o=>o.key===f.semaforo)||{}).label}`,
    tipoServico: `Tipo: ${f.tipoServico}`,
    diasMin: `Dias no setor ≥ ${f.diasMin}`,
    fase: `Fase: ${(FASE_FILTER_OPTS.find(o=>o.key===f.fase)||{}).label}`,
    aguardandoObra: "Aguardando obra concluir",
    empresaId: `Empresa: ${empresaNomeById(f.empresaId)}`,
  }[k];
}
// Opções do "+ Filtro": o filtro "Fase" só faz sentido onde a lista mistura
// fases (Minhas tarefas, Parados, Finalizados) — nas páginas que já são de uma
// fase específica ele não serviria pra nada.
const VIEWS_DE_UMA_FASE = ["comercial","interno","trilhas","remembramento"];
function filterMenuHTML(f, showSemaforo){
  if(state.fmenu==="root"){
    const tipos = [["responsavel","Responsável"], ...(showSemaforo?[["semaforo","Semáforo"]]:[]), ["tipoServico","Tipo de serviço"], ...(MOSTRAR_PRAZOS?[["diasMin","Dias no setor"]]:[]),
      ...(VIEWS_DE_UMA_FASE.includes(state.view)?[]:[["fase","Fase"]]), ["aguardandoObra","Aguardando obra concluir"]];
    return tipos.map(([k,l])=>`<button data-action="fmenu-pick" data-key="${k}">${l}${f[k]?" ✓":""}</button>`).join("");
  }
  const k = state.fmenu;
  const opts = k==="responsavel" ? TEAM.map(n=>[n,n]) : k==="semaforo" ? SEMAFORO_FILTER_OPTS.map(o=>[o.key,o.label])
    : k==="tipoServico" ? TIPOS_SERVICO.map(t=>[t,t]) : k==="fase" ? FASE_FILTER_OPTS.map(o=>[o.key,o.label]) : [];
  return `<button class="fback" data-action="fmenu-open">‹ Voltar</button>` + (k==="diasMin"
    ? `<div class="fnum">Parado há pelo menos <input type="number" min="0" data-action="filter-dias" value="${esc(f.diasMin)}"> dias</div>`
    : opts.map(([v,l])=>`<button data-action="fmenu-set" data-key="${k}" data-value="${esc(v)}">${esc(l)}${f[k]===v?" ✓":""}</button>`).join(""));
}
// Barra de filtros acima de cada lista: botão "+ Filtro", etiquetas dos filtros
// ativos (removíveis), e à direita a ordenação e a contagem. `showSemaforo` fica
// falso em Finalizados, onde o semáforo não existe.
function renderFilterBar(baseList, filteredList, showSemaforo){
  const f = state.filters;
  const ativos = ["responsavel","semaforo","tipoServico","diasMin","fase","aguardandoObra","empresaId"].filter(k=>f[k]);
  return `<div class="filter-bar">
    <div class="fmenu-host">
      <button class="fbtn ${state.fmenu?"open":""}" data-action="fmenu-open">+ Filtro</button>
      ${state.fmenu ? `<div class="fmenu">${filterMenuHTML(f, showSemaforo)}</div>` : ""}
    </div>
    ${ativos.length===0 ? `<span class="fhint">Nenhum filtro aplicado</span>` :
      ativos.map(k=>`<span class="fchip">${esc(filterChipLabel(k,f))}<button data-action="filter-unset" data-key="${k}" title="Remover filtro">✕</button></span>`).join("")
      + `<button class="filter-clear" data-action="filter-clear">Limpar</button>`}
    <span style="flex:1"></span>
    <select data-action="sort-by" title="Ordem da lista">
      ${SORT_OPTS.map(o=>`<option value="${o.key}" ${o.key===state.sortBy?"selected":""}>${o.label}</option>`).join("")}
    </select>
    <span class="filter-count num" style="margin-left:0">${filteredList.length} de ${baseList.length} projetos</span>
  </div>`;
}

// "No seu radar" — só em Minhas tarefas, acima do mural de menções: os processos
// que alguém pediu pra você ficar de olho, com o motivo e quem pediu.
function renderRadarMural(){
  const items = collectRadar(state.currentUser);
  if(items.length===0) return "";
  return `<div style="margin-bottom:18px">
    <div class="section-title" style="margin-bottom:8px">${ICONS.eye} No seu radar <span class="nav-badge">${items.length}</span></div>
    <div class="postits">
      ${items.map(({projeto:p, radar:r})=>`
        <div class="postit" draggable="true" data-drag="radar" style="--pi-bg:var(--info-bg)" data-action="radar-open" data-id="${p.id}" title="${esc(r.motivo||"")}">
          <div class="pi-head"><span class="drag-h" title="Arraste para mudar a ordem">⠿</span><b style="flex:1">${esc(p.numeroProcesso || clienteNome(p))}</b><span>${r.data}</span></div>
          <div class="pi-sub">${esc(p.numeroProcesso ? clienteNome(p) : p.endereco)}</div>
          <div class="pi-text">${r.motivo ? esc(r.motivo) : `<span style="color:var(--ink-soft)">Sem motivo informado.</span>`}</div>
          <div class="pi-foot"><span class="pi-sub">de ${esc(r.por)}</span><button class="pi-btn" data-action="radar-remove" data-id="${p.id}" data-pessoa="${esc(r.pessoa)}">Tirar do radar</button></div>
        </div>`).join("")}
    </div>

}
// Mural de menções — só na view "Minhas tarefas", acima da lista de
// projetos de sempre. Agrega comentários de qualquer projeto (não só os que
// já aparecem em "mine" por responsabilidade) onde o usuário atual foi
// mencionado numa observação ainda não resolvida.
function renderMuralMencoes(){
  const items = collectPendingMentions(state.currentUser);
  return `<div style="margin-bottom:18px">
    <div class="section-title" style="margin-bottom:8px">${ICONS.msg} Mural de menções${items.length>0?` <span class="nav-badge">${items.length}</span>`:""}</div>
    ${items.length===0 ? `<div class="empty-state">Nenhum comentário te aguardando no momento.</div>` : `
      <div class="postits">
        ${items.map(({projeto:p, comment:c})=>{
          const t = COMMENT_TIPO[c.tipo] || COMMENT_TIPO.nota; // a cor do post-it segue o tipo do comentário
          return `<div class="postit" draggable="true" data-drag="mencoes" data-action="mural-open" data-id="${p.id}:${c.id}" data-pid="${p.id}" style="--pi-bg:${t.bg}" title="${esc(c.texto)}">
          <div class="pi-head"><span class="drag-h" title="Arraste para mudar a ordem">⠿</span><b style="flex:1">${esc(p.numeroProcesso || clienteNome(p))}</b><span>${c.data}</span></div>
          <div class="pi-sub">${esc(p.numeroProcesso ? clienteNome(p) : p.endereco)} · de ${esc(c.autor)}</div>
          <div>${revBadge(c.rev)}${tipoBadge(c.tipo, c.solicitante)}</div>
          <div class="pi-text">${esc(c.texto)}</div>
          <div class="pi-foot"><span></span><button class="pi-btn" data-action="mural-resolve" data-id="${p.id}" data-cid="${c.id}">Marcar resolvida</button></div>
        </div>`;}).join("")}
      </div>
    `}
  </div>`;
}

// Célula "Cliente" das tabelas de lista: dot de semáforo + nome + badges de
// modificação/observação pendente. Usada tanto em renderChecklistList quanto
// em renderList — mesma marcação, sem variação entre as duas.
// Nº de protocolo + endereço (lote/quadra) + loteamento/bairro, compactados
// numa segunda linha menor sob o nome do cliente — só entram os que tiverem
// valor. Modificação pendente / observação não resolvida viram ícones ao
// lado do nome (com tooltip), em vez do selo de texto de antes.
// Botão "Copiar" do nº de protocolo (ver a ação copy-protocolo).
function copyProtocoloBtn(numero){
  return `<button class="copy-btn" data-action="copy-protocolo" data-value="${esc(numero)}" title="Copiar nº do protocolo">${ICONS.copy}<span>Copiar</span></button>`;
}
// Em "prefeitura" (Trilhas da prefeitura e Remembramento) o nº de protocolo é a identificação
// mais usada: vira o título grande da célula, com botão de copiar, e cliente /
// endereço / lote passam pra linha menor de baixo. Sem protocolo, cai no layout normal.
function renderClienteCell(p, opts){
  const prefeitura = !!(opts && opts.prefeitura);
  const emDestaque = prefeitura && p.numeroProcesso;
  const linha2 = (emDestaque ? [clienteNome(p), p.endereco, p.loteQuadra] : [p.numeroProcesso, p.endereco, p.loteQuadra]).filter(Boolean).map(esc).join(' · ');
  return `<td>
    <div style="display:flex;align-items:flex-start;gap:7px">
      <span class="dot" style="background:${semaforoDot(p.semaforo)};flex:none;margin-top:${emDestaque?7:0}px"></span>
      <div style="min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${emDestaque ? `<span class="protocolo">${esc(p.numeroProcesso)}</span>${copyProtocoloBtn(p.numeroProcesso)}`
            : `<span style="font-weight:600">${esc(clienteNome(p))}</span>${prefeitura ? `<span class="protocolo-vazio">sem protocolo</span>` : ""}`}
          ${(p.radar||[]).length>0 ? `<span class="cell-flag" style="color:var(--info-ink)" title="${esc("No radar: " + p.radar.map(r=>r.pessoa + (r.motivo?` (${r.motivo})`:"")).join("; "))}">${ICONS.eye}</span>` : ""}
          ${pendentesAbertos(p).length>0 ? `<span class="cell-flag" style="color:var(--red-ink)" title="${pendentesAbertos(p).length} comentário(s) pendente(s)">${ICONS.edit}</span>` : ""}
          ${pendingMentions(p, state.currentUser).length>0 ? `<span class="cell-flag" style="color:var(--info-ink)" title="Observação pendente">${ICONS.msg}</span>` : ""}
        </div>
        ${linha2 ? `<div class="cell-sub">${linha2}</div>` : ""}
      </div>
    </div>
  </td>`;
}

function renderChecklistList(list, track, emptyMsg, opts){
  if(list.length===0) return `<div class="empty-state">${emptyMsg}</div>`;
  return `<div class="list-card"><table>
    <thead><tr><th>Cliente</th><th>${mkLoteCol()?"Lote / quadra":"Endereço"}</th><th>Responsável</th><th>Checklist</th>${MOSTRAR_PRAZOS?`<th>Total</th>`:""}<th></th></tr></thead>
    <tbody>${list.map(p=>{
      const items = stepsOf(p, track);
      const done = checklistDone(p, track);
      return `<tr class="row" data-action="open" data-id="${p.id}">
        ${renderClienteCell(p, opts)}
        <td data-label="${mkLoteCol()?"Lote / quadra":"Endereço"}">${mkLoteCol() ? esc(p.loteQuadra||"—") : esc(p.endereco)}</td>
        <td data-label="Responsável">${esc(p.responsavel||"—")}</td>
        <td data-label="Checklist"><div class="checklist-inline">${items.map((label,idx)=>{
          return `<span class="fee-row" data-action="checklist" data-id="${p.id}" data-track="${track}" data-index="${idx}">${done[idx]?ICONS.sqCheck:ICONS.sq}<span>${esc(label)}</span></span>`;
        }).join("")}</div></td>
        ${MOSTRAR_PRAZOS?`<td class="num" data-label="Total">${p.diasTotal}d</td>`:""}
        <td>${ICONS.chev}</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

function renderList(list, emptyMsg, opts){
  if(list.length===0) return `<div class="empty-state">${emptyMsg}</div>`;
  return `<div class="list-card"><table>
    <thead><tr><th>Cliente</th><th>Fase / setor</th><th>Responsável</th><th>Bloqueio</th>${MOSTRAR_PRAZOS?`<th>Total</th><th>No setor</th>`:""}<th></th></tr></thead>
    <tbody>${list.map(p=>{
      const chip = semaforoChip(p.semaforo);
      return `<tr class="row" data-action="open" data-id="${p.id}">
        ${renderClienteCell(p, opts)}
        ${mkEtapaCell(p)}<td data-label="Responsável">${esc(p.responsavel||"—")}</td>${mkBloqCell(p)}${MOSTRAR_PRAZOS?`<td class="num" data-label="Total">${p.diasTotal}d</td><td data-label="No setor"><span class="pill num" style="padding:2px 9px;font-size:12px;background:${chip.bg};color:${chip.fg}">${p.diasSetor}d</span></td>`:""}
        <td>${ICONS.chev}</td>
      </tr>`;
    }).join("")}</tbody>
  </table></div>`;
}

// Seção de uma trilha dentro do card expandido (usada 1x ou 2x por aba —
// "Projeto" empilha Elaboração + Abertura de processo).
function renderTrackSection(p, track){
  const t = p.tracks[track];
  const linha = mkTrackSection(p, track); if(linha) return linha;
  if(LOG_TRACKS.includes(track)){
    // trilhaPrincipal/trilhaHabitese não mostram mais chips de checkpoint —
    // o seletor de setor+motivo cobre tudo (inclusive voltar a um setor já
    // visitado, o que uma lista linear de chips não representaria bem).
    return `<div style="padding-top:14px">
      <div class="track-head"><span>${TRACK_LABEL[track]} · ${t.status}</span><span class="num">${t.pct}% · ${esc(t.setorLabel)}</span></div>
      <div class="bar"><div class="bar-fill" style="width:${t.pct}%"></div></div>
      ${renderPassagemSelector(p, track)}
      ${p.activeTrack===track && p.hasFee ? renderLogFeeBox(p, track) : ""}
      ${renderPassagemHistorico(p, track)}
    </div>`;
  }
  return `<div style="padding-top:14px">
    <div class="track-head"><span>${TRACK_LABEL[track]} · ${t.status}</span><span class="num">${t.pct}% · ${esc(t.setorLabel)}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${t.pct}%"></div></div>
    ${t.steps.length===0 ? `<div class="empty-state" style="margin-top:11px">Esta trilha está sem etapas cadastradas — adicione em Configurações.</div>` : `
      <div class="steps steps-linked">${t.steps.map((label,i)=>{
        const cls = i===t.currentIndex ? "current" : (i<t.currentIndex||t.concluida) ? "done" : "";
        const chip = `<span class="step ${cls}" data-action="step" data-id="${p.id}" data-track="${track}" data-index="${i}">${esc(label)}</span>`;

}

// Seletor de setor+motivo pra trilhaPrincipal/trilhaHabitese: escolher

// não aparece como uma escolha livre — só um botão explícito avança dela.
function renderPassagemSelector(p, track){
  const log = p[track+"Log"] || [];

  if(openCombo && openCombo.fechamentoManual){
    return `<div style="margin-top:14px">
      <div class="field-label" style="margin-bottom:6px">Situação atual</div>
      <div class="status-chip" style="background:var(--info-bg);color:var(--info-ink)"><span class="status-dot" style="background:currentColor"></span>${esc(open.setor)} — ${esc(open.motivo)}</div>

    </div>`;
  }
  const menuKey = `${p.id}:${track}`;
  const isOpen = state.statusMenuOpen === menuKey;
  const chipLabel = open ? `${open.setor} — ${open.motivo}` : (log.length>0 ? `${log[log.length-1].setor} — ${log[log.length-1].motivo} (concluída)` : "Não iniciada");
  const bySetor = {};
  catalog.forEach((c,i)=>{ if(c.fechamentoManual) return; (bySetor[c.setor] = bySetor[c.setor]||[]).push(c); });
  return `<div style="margin-top:14px">

    <div class="status-select ${isOpen?"open":""}" data-stop="1">

        <span class="status-dot" style="background:currentColor"></span>${esc(chipLabel)}
        <svg class="icon chev-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      ${isOpen ? `<div class="status-menu">
        ${Object.keys(bySetor).map(setor=>`
          <div class="status-group-label">${esc(setor)}</div>
          ${bySetor[setor].map(c=>`<div class="status-opt" data-action="passagem-opt" data-id="${p.id}" data-track="${track}" data-setor="${esc(c.setor)}" data-motivo="${esc(c.motivo)}">
            <span class="status-dot" style="background:${open && open.setor===c.setor && open.motivo===c.motivo ? "var(--ink)" : "var(--ink-faint)"}"></span>${esc(c.motivo)}

// Revisão (REV00, REV01...) a que um comentário se refere, opcional: a pessoa
// digita só o número no campo "REV nº" e fica salvo como REV + 2 dígitos.
const revNome = n => "REV" + String(n).padStart(2,"0");
const revNumero = r => parseInt(String(r||"").replace(/\D/g,""),10);
// "REV03" -> "3" (pro campo de número) e o caminho inverso (vazio = sem revisão)
const revNumeroTexto = r => { const n = revNumero(r); return isNaN(n) ? "" : String(n); };
const revDeNumero = v => (String(v).trim()==="" || isNaN(parseInt(v,10)) || parseInt(v,10)<0) ? "" : revNome(parseInt(v,10));
// Comentários que citam uma revisão, agrupados por REV (mais recente primeiro):
// o resumo "o que mudou em cada revisão".
function revisoesDoProjeto(p){
  const mapa = new Map();
  for(const c of p.comments){ if(!c.rev) continue; if(!mapa.has(c.rev)) mapa.set(c.rev, []); mapa.get(c.rev).push(c); }
  return [...mapa.entries()].sort((a,b)=> revNumero(b[0]) - revNumero(a[0]));
}
// Selo colorido do tipo do comentário.
function tipoBadge(tipo, solicitante){
  const t = COMMENT_TIPO[tipo] || COMMENT_TIPO.nota;
  const quem = tipo==="modificacao" && SOLICITANTE_LABEL[solicitante] ? ` · ${SOLICITANTE_LABEL[solicitante]}` : "";
  return `<span class="badge-mod" style="background:${t.bg};color:${t.ink}">${esc(t.label)}${quem}</span>`;
}
function revBadge(rev){
  return rev ? `<span class="badge-mod" style="background:var(--ink);color:var(--cream)">${esc(rev)}</span>` : "";
}
function editCommentStart(pid, cid){
  const p = findProjeto(pid); const c = p && p.comments.find(x=>x.id===cid);
  if(!c || c.autor!==state.currentUser) return; // só o autor edita o próprio comentário
  setState({editComment:{pid, cid, texto:c.texto, rev:revNumeroTexto(c.rev)}, focusEdit:true});
}
function editCommentSave(){
  const e = state.editComment; if(!e) return;
  const p = findProjeto(e.pid); const c = p && p.comments.find(x=>x.id===e.cid);
  const texto = (e.texto||"").trim();
  if(!c || c.autor!==state.currentUser || !texto){ setState({editComment:null}); return; }
  const rev = revDeNumero(e.rev) || null;
  if(texto!==c.texto || rev!==(c.rev||null)){
    captureUndo(p, "Editar comentário");
    c.texto = texto; c.rev = rev; c.editado = true;
    pushLog(p, `${state.currentUser} editou um comentário`);
    syncProjeto(p);
  }
  setState({editComment:null});
}

function renderConfigRow(tipo, g, steps, step, i, pending, isLog){

  return isLog ? renderConfigRowLog(tipo, g, step, i, steps) : renderConfigRowStep(tipo, g, step, i, steps);
}
function renderConfigGroup(tipo, workflow, g){
  const enabled = g.toggle ? workflow[g.toggle] : true;
  const steps = workflow[g.key];
  const pending = state.configConfirmRemove;
  const isLog = LOG_TRACKS.includes(g.key); // trilhaPrincipal/trilhaHabitese: catálogo setor+motivo, não lista de etapas

// Cada tecla desse mapa é um data-action do markup; o valor é o handler desse
// clique. Trocar o if/else-if único (que só crescia) por um mapa deixa cada
// ação isolada e testável, e adicionar uma ação nova vira só "acrescentar uma
// chave" em vez de "mais um else if no meio de uma função gigante".
// Copia texto pra área de transferência. clipboard.writeText exige contexto
// seguro (https/localhost); fora dele cai no textarea + execCommand.
function copyText(text){
  const fallback = ()=>{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){}
    ta.remove();
    return ok;
  };
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(()=>true, ()=>fallback());
  }
  return Promise.resolve(fallback());
}

      const tipo = state.configDraft.tipo;
      state.workflows[tipo] = state.configDraft.workflow;
      state.configDraft = null;
      syncWorkflow(tipo);
      clampProjectIndices();
      // remover/reordenar etapas pode ter puxado o índice de projetos desse
      // tipo de serviço pra trás — sincroniza os afetados junto com a config.
      for(const p of state.projetos) if(p.tipoServico===tipo) syncProjeto(p);
    } else {
      clampProjectIndices();
    }
    state.configConfirmRemove = null;
    save();

  else if(el && el.dataset.action==="radar-motivo"){ state.radarMotivo = el.value; }

  else if(el && el.dataset.action==="nota-projeto-input"){ state.notaProjetoDraft = el.value; }
  else if(el && el.dataset.action==="search-input"){
    // busca é ao vivo (precisa re-renderizar o dropdown a cada tecla, ao

    state.searchQuery = el.value;

app.addEventListener("submit", (e)=>{
  const form = e.target.closest("#novo-form");
  if(!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  // resolve a empresa escolhida no autocomplete — se a pessoa digitou um
  // nome e nunca clicou numa sugestão/"cadastrar", resolve na hora do
  // envio (acha por nome normalizado, ou cadastra se realmente for novo).
  const pk = state.empresaPicker || defaultEmpresaPicker();
  let empresaId = pk.selectedId;
  if(!empresaId && pk.query.trim()) empresaId = ensureEmpresa(state.empresas, pk.query.trim()).id;
  if(!empresaId){
    // sem empresa selecionada/digitada não dá pra criar — e a pessoa precisa
    // ver o porquê, em vez de o botão parecer quebrado
    setState({novoError:"Escolha uma empresa da lista ou digite o nome do cliente."});
    return;
  }
  createProjeto({
    empresaId, endereco: fd.get("endereco"), loteQuadra: fd.get("loteQuadra"),
    tipoServico: fd.get("tipoServico"), infoBasicas: fd.get("infoBasicas"),
  });
});

// Substituir o innerHTML zera scroll e foco — captura antes de renderizar
// (scroll do conteúdo, foco+cursor da busca e do seletor de empresa, que
// re-renderizam a cada tecla pro dropdown acompanhar em tempo real) pra
// restaurar depois em restoreUIState.
// Qual janela (card de projeto ou "novo projeto") está aberta — pra só devolver a
// rolagem do card se for o MESMO card de antes do redesenho.
let lastModalKey = null;
function modalKey(){ return state.openId ? "p:"+state.openId : (state.showNovo ? "novo" : null); }
function captureUIState(){
  const modalEl = app.querySelector(".modal");
  const scrollEl = app.querySelector(".content");
  const ae0 = document.activeElement;
  const searchEl = (ae0 && ae0.dataset && ae0.dataset.action==="search-input") ? ae0 : app.querySelector("#search-input");
  const searchHadFocus = document.activeElement === searchEl;
  const empresaEl = app.querySelector("#empresa-picker-input");
  const empresaHadFocus = document.activeElement === empresaEl;
  // formulário "Novo projeto": o painel se redesenha a cada mudança de
  // qualquer pessoa da equipe (tempo real) e a cada minuto — sem guardar o
  // que já foi digitado, endereço/tipo/observações sumiam no meio do cadastro.
  const novoForm = app.querySelector("#novo-form");
  const ae = document.activeElement;
  return {
    scrollTop: scrollEl ? scrollEl.scrollTop : 0,
    modalScroll: modalEl ? modalEl.scrollTop : 0, modalWas: modalEl ? lastModalKey : null,
    searchHadFocus, searchId: searchHadFocus ? searchEl.id : null, searchSel: searchHadFocus ? [searchEl.selectionStart, searchEl.selectionEnd] : null,
    empresaHadFocus, empresaSel: empresaHadFocus ? [empresaEl.selectionStart, empresaEl.selectionEnd] : null,
    novoValues: novoForm ? Object.fromEntries(new FormData(novoForm)) : null,
    novoFocus: (novoForm && ae && ae.form===novoForm && ae.name) ? {name: ae.name, start: ae.selectionStart ?? null, end: ae.selectionEnd ?? null} : null,
  };
}
function restoreUIState(saved){
  const newScrollEl = app.querySelector(".content");
  if(newScrollEl) newScrollEl.scrollTop = saved.scrollTop;
  // sem isso, qualquer escolha dentro do card (tipo, revisão, pessoa...) redesenhava a
  // tela e o card voltava pro topo — parecia que a página "pulava".
  const newModal = app.querySelector(".modal");
  if(newModal && saved.modalWas && saved.modalWas===modalKey()) newModal.scrollTop = saved.modalScroll;
  if(saved.searchHadFocus){
    const newSearchEl = app.querySelector("#"+(saved.searchId||"search-input"));
    if(newSearchEl){ newSearchEl.focus(); newSearchEl.setSelectionRange(saved.searchSel[0], saved.searchSel[1]); }
  }
  if(saved.empresaHadFocus){
    const newEmpresaEl = app.querySelector("#empresa-picker-input");
    if(newEmpresaEl){ newEmpresaEl.focus(); newEmpresaEl.setSelectionRange(saved.empresaSel[0], saved.empresaSel[1]); }
  }
  const novoForm = saved.novoValues && app.querySelector("#novo-form");
  if(novoForm){
    for(const [name, val] of Object.entries(saved.novoValues)){ if(novoForm.elements[name]) novoForm.elements[name].value = val; }
    const f = saved.novoFocus && novoForm.elements[saved.novoFocus.name];
    if(f){
      f.focus();
      if(saved.novoFocus.start!=null && f.setSelectionRange){ try{ f.setSelectionRange(saved.novoFocus.start, saved.novoFocus.end); }catch(_){} }
    }
  }
  // clique no mural de menções: abre o modal já na seção de comentários, em
  // vez do topo padrão — flag consumida uma única vez por abertura.
  if(state.scrollToComments){
    const commentsEl = app.querySelector("#comments-section");
    if(commentsEl) commentsEl.scrollIntoView({block:"start"});
    state.scrollToComments = false;
  }
}
function renderErrorFallback(err){
  console.error(err);
  return `<div style="padding:40px;max-width:520px;font-family:'Work Sans',sans-serif">
      <h2 style="font-family:'Lora',serif;margin-bottom:10px">Algo deu errado ao carregar o painel</h2>
      <p style="font-size:13px;color:rgba(28,26,23,.65);margin-bottom:16px">Tente recarregar a página. Se o problema continuar, avise quem administra o painel.</p>
      <button onclick="location.reload();" style="font-size:13px;padding:10px 18px;border-radius:999px;border:none;background:#1c1a17;color:#f7f2ea;cursor:pointer">Recarregar</button>
    </div>`;
}
function render(){
  const saved = captureUIState();
  try{
    app.innerHTML = renderApp();
    restoreUIState(saved);
    lastModalKey = modalKey();
    app.querySelectorAll(".mk-tl").forEach(tl=>{ // linha do tempo: leva a etapa atual pro centro
      const c = tl.querySelector(".mk-tn.cur"); if(c) tl.scrollLeft = Math.max(0, c.offsetLeft - tl.clientWidth/2 + c.offsetWidth/2);
    });
    if(state.focusSel){ // devolve o cursor ao campo (ex.: depois de escolher o tipo do comentário)
      const campo = app.querySelector(state.focusSel); state.focusSel = null;
      if(campo){ campo.focus(); const v = campo.value; campo.value = ""; campo.value = v; }
    }
    if(state.focusEdit){ // acabou de abrir uma edição: põe o cursor no fim do campo
      state.focusEdit = false;
      const f = app.querySelector("[data-autofocus]");
      if(f){ f.focus(); const v = f.value; f.value = ""; f.value = v; }
    }
  }catch(err){
    app.innerHTML = renderErrorFallback(err);
  }
}

function seedEmpresas(){
  return ["Construtora Alvorada","Incorporadora Vale Verde","Família Menezes","Residencial Bosque Azul","Studio Pedra & Cal",
          "Grupo Maré Alta","Clínica Vida Nova","Padaria Trigo Dourado"].map(nome=>({id:uid(), nome}));

function seedProjetos(empresas){
  const E = n=>empresas[n].id;
  const ago = (d,h)=> new Date(Date.now() - d*86400000 - (h||0)*3600000).toISOString();
  const flow = ["comercial","elaboracao","abertura","remembramento","trilhaPrincipal","trilhaAmbiental","trilhaHabitese"];
  const wfs = buildDefaultWorkflows();
  const out = [];
  // c: {emp,end,lote,tipo,contrato(dias),fase,idx,diasSetor,resp,bloq,info,processo,iptu,log:[[catIdx,diasAtras]],comments,mod}
  function mk(c){
    const p = normalizeProjeto({
      id:uid(), empresaId:E(c.emp), endereco:c.end, loteQuadra:c.lote||null, tipoServico:c.tipo,
      dataContrato:ago(c.contrato), numeroProcesso:c.processo||null, numeroIptu:c.iptu||null, infoBasicas:c.info||null,
      fase:c.fase, faseDesde:ago(c.diasSetor), responsavel:c.resp||null, statusBloqueio:c.bloq||"Ok",
      dataEntradaSetorAtual:ago(c.diasSetor), dataAberturaProcesso:c.abertura?ago(c.abertura):undefined,
      taxaEnviada:{checked:false,data:null,autor:null}, comprovante:{checked:false,data:null,autor:null},
      finalizado:c.fase==="finalizado", comments:[], modificacoes:[], log:[],
    });
    const w = wfs[c.tipo];
    const activeTrack = c.fase==="finalizado" ? null : TRACK_OF_FASE[c.fase];
    const stop = activeTrack ? flow.indexOf(activeTrack) : flow.length;
    flow.forEach((t,i)=>{
      const on = w[TOGGLE_OF_TRACK[t]] !== false;
      if(!on || i>stop) return;
      const isActive = t===activeTrack;
      if(LOG_TRACKS.includes(t)){
        const entries = isActive ? c.log : (c.logDone && c.logDone[t]) || fullLog(w, t);
        p[t+"Log"] = buildLog(w[t], entries, c.resp);
      } else {
        const len = w[t].length;
        const idx = isActive ? c.idx : len-1;
        p[t+"Index"] = idx; p[t+"Concluida"] = !isActive;
        p[t+"Done"] = w[t].map((_,k)=> isActive ? k<=idx : true);
      }
    });
    p.log = [
      {id:uid(), texto:`${c.resp||"Ana"} criou o projeto`, data:fmtDateTime(ago(c.contrato))},
      ...(activeTrack ? [{id:uid(), texto:`${c.resp||"Ana"} moveu ${TRACK_LABEL[activeTrack]} para a etapa atual`, data:fmtDateTime(ago(c.diasSetor))}] : [{id:uid(), texto:"Projeto finalizado", data:fmtDateTime(ago(c.diasSetor))}]),
    ].reverse();
    (c.comments||[]).forEach(([autor,texto,dias,obs,men])=>p.comments.push({id:uid(), autor, texto, data:fmtDate(ago(dias)), tipo:obs?"correcao":"nota", observacao:!!obs, mencionado:men||null, resolvida:false, dataResolucao:null}));
    (c.extra||[]).forEach(([autor,texto,dias,tipo,men,res,rev,sol])=>p.comments.push({id:uid(), autor, texto, data:fmtDate(ago(dias)), tipo, solicitante:sol||null, rev:rev||null, observacao:true, mencionado:men||null, resolvida:!!res, dataResolucao:res?fmtDate(ago(dias-1)):null}));
    p.radar = (c.radar||[]).map(([pessoa,motivo,por,dias])=>({pessoa, motivo, por, data:fmtDate(ago(dias))}));
    out.push(p);
  }
  function buildLog(catalog, entries, resp){
    return entries.map(([ci,dias],k)=>{
      const cb = catalog[ci];
      const next = entries[k+1];
      const e = {id:uid(), setor:cb.setor, motivo:cb.motivo, responsavel:resp||"Ana", dataEntrada:ago(dias),
        dataSaida: next ? ago(next[1]) : null, ordemSequencial:k+1, diasEsperado: cb.semSla ? 0 : cb.dias};
      if(cb.fee) e.fee = buildFeeObject();
      return e;
    });
  }
  function fullLog(w, t){ const n = w[t].length; return Array.from({length:n},(_,i)=>[i, 140-i*10]); }

  mk({emp:0,end:"Rua das Acácias, 120",lote:"Lote 12 / Quadra B",tipo:"Aprovação",contrato:3,fase:"contrato",idx:1,diasSetor:1,resp:"Ana",info:"Residência térrea, 3 quartos"});
  mk({emp:6,end:"Av. Central, 845",lote:"Lote 3 / Quadra 40",tipo:"3D",contrato:6,fase:"contrato",idx:3,diasSetor:2,resp:"Carla",info:"Maquete eletrônica da fachada"});
  mk({emp:2,end:"Rua do Sol, 77",lote:"Lote 7 / Quadra D",tipo:"Aprovação",contrato:14,fase:"elaboracao",idx:2,diasSetor:4,resp:"Bruno",info:"Sobrado com 2 pavimentos",
      comments:[["Bruno","Cliente enviou a planta de situação atualizada.",2],["Ana","Conferir recuo frontal antes de protocolar.",1,true,"Bruno"]]});
  mk({emp:5,end:"Rua dos Ipês, 410",lote:"Lote 21 / Quadra A",tipo:"Legalização",contrato:30,fase:"elaboracao",idx:0,diasSetor:12,resp:"Diego",bloq:"Aguardando cliente",info:"Regularização de ampliação de 48 m²"});
  mk({emp:3,end:"Alameda Bosque Azul, 15",lote:"Lote 1 / Quadra G",tipo:"Modificação",contrato:45,fase:"abertura_processo",idx:1,diasSetor:2,resp:"Elisa",abertura:2,processo:"2025/48213",
      info:"Alteração de projeto aprovado"});
  mk({emp:1,end:"Rua das Palmeiras, 300",lote:"Lote 9 / Quadra C",tipo:"Aprovação",contrato:60,fase:"licenca_obra",diasSetor:6,resp:"Ana",abertura:40,processo:"2025/47102",iptu:"01.02.034.0120",
      log:[[0,30],[1,20],[2,6]]});
  mk({emp:0,end:"Av. Beira Rio, 2200",lote:"Lote 5 / Quadra 12",tipo:"Aprovação",contrato:75,fase:"licenca_obra",diasSetor:9,resp:"Carla",bloq:"Aguardando pagamento",abertura:55,processo:"2025/46555",iptu:"01.03.077.0410",
      log:[[0,40],[1,32],[2,22],[3,18],[4,9]],extra:[["Carla","Prefeitura exigiu certidão de matrícula atualizada.",20,"exigencia",null,true]],comments:[["Carla","Boleto da taxa de licença gerado, aguardando pagamento do cliente.",3,true,"Ana"]]});
